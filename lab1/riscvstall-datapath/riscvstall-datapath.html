<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>riscvstall 管線接線圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1F0; --panel:#FAFCFB; --ink:#172826; --muted:#5A6E6B; --line:#C5D1CE;
  --band-c:#E2E9F6; --band-d:#E4EEEA; --band-m:#ECE9E1; --stage:#00000008;
  --node:#FFFFFF; --node-stroke:#36504E; --reg:#D5E2DF;
  --w-data:#27474B; --w-ctrl:#2B5FD4; --w-stall:#B0246A; --hot:#DB6E00;
  --code-bg:#EEF3F2; --chip:#FFFFFF; --chip-on:#172826; --chip-on-ink:#FAFCFB;
  --sans:"IBM Plex Sans","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1617; --panel:#152022; --ink:#E2EDEA; --muted:#8CA3A0; --line:#2B3B3C;
    --band-c:#141E31; --band-d:#13201E; --band-m:#1D1C17; --stage:#FFFFFF07;
    --node:#1B292B; --node-stroke:#7F9D9A; --reg:#25383A;
    --w-data:#A6C4C7; --w-ctrl:#7C9FFF; --w-stall:#FF83BB; --hot:#FFAD42;
    --code-bg:#0F191A; --chip:#1B292B; --chip-on:#E2EDEA; --chip-on-ink:#0E1617;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1617; --panel:#152022; --ink:#E2EDEA; --muted:#8CA3A0; --line:#2B3B3C;
  --band-c:#141E31; --band-d:#13201E; --band-m:#1D1C17; --stage:#FFFFFF07;
  --node:#1B292B; --node-stroke:#7F9D9A; --reg:#25383A;
  --w-data:#A6C4C7; --w-ctrl:#7C9FFF; --w-stall:#FF83BB; --hot:#FFAD42;
  --code-bg:#0F191A; --chip:#1B292B; --chip-on:#E2EDEA; --chip-on-ink:#0E1617;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding-inline:20px;padding-block:18px 32px}
.app{max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-wrap:balance}
h1 span{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--muted);margin-left:8px}
header p{margin:0;color:var(--muted);max-width:70ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group>b{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
button.chip{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:3px;padding:4px 9px;cursor:pointer}
button.chip:hover{border-color:var(--node-stroke)}
button.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
button.chip.view{font-family:var(--sans)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
label.tog i{display:inline-block;width:22px;height:0;border-top:2px solid}
label.tog.c i{border-top:2px dashed var(--w-ctrl)} label.tog.s i{border-top:2px dotted var(--w-stall)} label.tog.d i{border-color:var(--w-data)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:14px;align-items:start}
.work.wide{grid-template-columns:minmax(0,1fr) minmax(480px,48%)}
@media (max-width:1080px){.work,.work.wide{grid-template-columns:minmax(0,1fr)}}
.stagewrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;height:clamp(440px,82vh,940px);width:100%}
svg#cpu{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg#cpu.grabbing{cursor:grabbing}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.zoom button{width:30px;height:30px;font-size:16px;line-height:1;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:3px;cursor:pointer}
.hint{font-size:12px;color:var(--muted)}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:12px;padding:4px 8px;border-radius:3px;max-width:320px;z-index:5;white-space:nowrap}
#tip small{opacity:.7;margin-left:6px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px;height:clamp(440px,82vh,940px);overflow:auto}
@media (max-width:1080px){aside{height:auto}}
aside h2{font-family:var(--cond);font-size:19px;font-weight:700;margin:0;overflow-wrap:anywhere}
aside h2.mono{font-family:var(--mono);font-size:15px;font-weight:600}
aside .kicker{font-family:var(--cond);font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
aside p{margin:0}
aside ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
aside h3{font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:3px;padding:10px;font-family:var(--mono);font-size:11.5px;line-height:1.5;overflow-x:auto;color:var(--ink)}
.src{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.srchead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 0 -4px}
.srchead h3{margin:0}
.srchead button{font-size:12px;background:none;border:none;color:var(--muted);cursor:pointer;padding:0;text-decoration:underline}
.ftabs{display:flex;flex-wrap:wrap;gap:4px}
.ftabs button{font-family:var(--mono);font-size:11.5px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:3px 3px 0 0;padding:4px 8px;cursor:pointer}
.ftabs button i{font-style:normal;color:var(--muted);margin-left:6px}
.ftabs button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.ftabs button[aria-pressed="true"] i{color:inherit;opacity:.7}
.fpath{font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.jumps{display:flex;flex-wrap:wrap;gap:4px;max-height:84px;overflow:auto}
.jumps button{font-family:var(--mono);font-size:11px;background:none;border:1px solid var(--line);border-radius:3px;color:var(--ink);padding:1px 6px;cursor:pointer;font-variant-numeric:tabular-nums}
.jumps button:hover{border-color:var(--hot);color:var(--hot)}
.jumps button b{font-family:var(--sans);font-weight:500;color:var(--muted);margin-left:5px}
.jumps button.k-drive{border-left:3px solid var(--hot)}
aside>*{flex:none}
.codebox{flex:1 0 260px;position:relative;overflow:auto;background:var(--code-bg);border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:11.5px;line-height:1.55;tab-size:4}
.codebox .in{display:inline-block;min-width:100%;padding-block:6px}
.codebox .ln{display:flex;white-space:pre;padding-right:12px;border-left:3px solid transparent}
.codebox .ln .no{flex:none;width:44px;text-align:right;padding-right:10px;color:var(--muted);opacity:.65;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
.codebox .ln.hit{background:color-mix(in srgb,var(--hot) 16%,transparent);border-left-color:var(--hot)}
.codebox .ln.hit .no{opacity:1;color:var(--hot)}
.codebox .ln.flash{background:color-mix(in srgb,var(--hot) 38%,transparent)}
.codebox .cm{color:var(--muted)}
.codebox mark{background:var(--hot);color:var(--code-bg);border-radius:2px;padding:0 1px}
.nosrc{font-size:12.5px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:5px}
.links button{font-family:var(--mono);font-size:11.5px;background:none;border:1px solid var(--line);border-radius:3px;color:var(--ink);padding:2px 7px;cursor:pointer}
.links button:hover{border-color:var(--hot);color:var(--hot)}
.links button.data{border-left:3px solid var(--w-data)} .links button.ctrl{border-left:3px solid var(--w-ctrl)} .links button.stall{border-left:3px solid var(--w-stall)}
table.cs{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
table.cs td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.cs td:first-child{color:var(--muted);white-space:nowrap}
.steps{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px}
.steps b{font-family:var(--mono);font-weight:600;color:var(--hot)}
code{font-family:var(--mono);font-size:.92em}
.back{align-self:flex-start;font-size:12px;background:none;border:none;color:var(--muted);cursor:pointer;padding:0;text-decoration:underline}

/* ---- diagram ---- */
.band{stroke:var(--line);stroke-width:1}
.band.c{fill:var(--band-c)} .band.d{fill:var(--band-d)} .band.m{fill:var(--band-m)}
.bandt{font-family:var(--cond);font-size:13px;font-weight:600;fill:var(--muted);letter-spacing:.04em}
.stg{fill:var(--stage)} .stgt{font-family:var(--cond);font-weight:700;font-size:17px;fill:var(--muted);cursor:pointer}
.stgt:hover{fill:var(--hot)}
.bar{fill:var(--reg);opacity:.75} .bart{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
.net{color:var(--w-data)} .net.ctrl{color:var(--w-ctrl)} .net.stall{color:var(--w-stall)}
.net .w{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.net.ctrl .w{stroke-dasharray:5 3} .net.stall .w{stroke-dasharray:2 3}
.net.bus .w{stroke-width:3.4;stroke-dasharray:none;opacity:.85}
.net .hit{fill:none;stroke:transparent;stroke-width:9;pointer-events:stroke;cursor:pointer}
.net .ah,.net .dot{fill:currentColor;stroke:none}
.seg.on{color:var(--hot)} .seg.on .w{stroke-width:2.8}
.net.hl,.net.sel{color:var(--hot)} .net.hl .w,.net.sel .w{stroke-width:3}
.net.hl .seg,.net.sel .seg{color:var(--hot)}
svg.dim .seg:not(.on){opacity:.12} svg.dim .net:not(.on) .dot{opacity:.12}
svg.dim .net.hl .seg,svg.dim .net.sel .seg,svg.dim .net.hl .dot,svg.dim .net.sel .dot{opacity:1}
svg.dim .node:not(.on):not(.sel):not(.hl){opacity:.38}
svg.dim .nl:not(.on){opacity:.15}
svg.hide-ctrl .ctrl,svg.hide-stall .stall{display:none}
.node{cursor:pointer}
.node .sh{fill:var(--node);stroke:var(--node-stroke);stroke-width:1.4}
.node.cbox .sh{stroke:var(--w-ctrl)} .node.sbox .sh{stroke:var(--w-stall)}
.node.reg .sh{fill:var(--reg)} .node.mem .sh{stroke-width:2}
.node.hl .sh,.node.sel .sh{stroke:var(--hot);stroke-width:2.6}
.node.on .sh{stroke:var(--hot);stroke-width:2.2}
.node text{fill:var(--ink);font-family:var(--mono);font-size:11px;pointer-events:none}
.node text.t0{font-weight:600} .node text.zh{font-family:var(--sans);font-size:11.5px}
.node text.pt{font-size:8.5px;fill:var(--muted)} .node text.big{font-size:17px;font-weight:600}
.node text.mt,.node text.rl{font-size:9px;fill:var(--muted)}
.node .ck{fill:none;stroke:var(--node-stroke);stroke-width:1}
.node .insel{fill:var(--hot);font-weight:600}
.nl{font-family:var(--mono);font-size:9px;fill:var(--w-data);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.nl.ctrl{fill:var(--w-ctrl)} .nl.stall{fill:var(--w-stall)} .nl.on{fill:var(--hot)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>riscvstall 管線接線圖<span>riscv_Core = Ctrl + Dpath</span></h1>
    <p>從 Verilog 原始碼整理出的 5 級管線 (P→F→D→X→M→W)。滑過線路看訊號名稱；點任何元件或線路，右邊會打開相關的 Verilog 檔案並標出描述那塊電路的段落；選一道指令看它實際走過哪些線。</p>
  </header>

  <div class="toolbar">
    <div class="group" id="insbar"><b>指令路徑</b></div>
    <div class="group"><b>圖層</b>
      <label class="tog d"><i></i>資料</label>
      <label class="tog c"><input type="checkbox" id="lyCtrl" checked><i></i>控制</label>
      <label class="tog s"><input type="checkbox" id="lyStall" checked><i></i>stall / squash / 握手</label>
    </div>
    <div class="group" id="viewbar"><b>視角</b></div>
    <div class="hint">滾輪縮放 · 拖曳平移 · 點擊鎖定選取</div>
  </div>

  <div class="work">
    <div class="stagewrap" id="wrap">
      <svg id="cpu" role="img" aria-label="riscvstall 五級管線處理器的資料路徑與控制單元接線圖"></svg>
      <div id="tip" hidden></div>
      <div class="zoom"><button id="zi" aria-label="放大">+</button><button id="zo" aria-label="縮小">−</button><button id="zf" aria-label="顯示全圖">⤢</button></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
</div>

<script type="application/json" id="src-data">{"D": {"name": "riscvstall-CoreDpath.v", "path": "lab1/riscvstall/riscvstall-CoreDpath.v", "text": "//=========================================================================\n// 5-Stage RISCV Datapath\n//=========================================================================\n\n`ifndef RISCV_CORE_DPATH_V\n`define RISCV_CORE_DPATH_V\n\n`include \"imuldiv-IntMulDivIterative.v\"\n`include \"riscvstall-InstMsg.v\"\n`include \"riscvstall-CoreDpathAlu.v\"\n`include \"riscvstall-CoreDpathRegfile.v\"\n\nmodule riscv_CoreDpath\n(\n  input clk,\n  input reset,\n\n  // Instruction Memory Port\n\n  output [31:0] imemreq_msg_addr,\n\n  // Data Memory Port\n\n  output [31:0] dmemreq_msg_addr,\n  output [31:0] dmemreq_msg_data,\n  input  [31:0] dmemresp_msg_data,\n\n  // Controls Signals (ctrl->dpath)\n  \n  input         imem_initial_fetch_Fhl,\n  input   [1:0] pc_mux_sel_Phl,\n  input   [1:0] op0_mux_sel_Dhl,\n  input   [2:0] op1_mux_sel_Dhl,\n  input  [31:0] inst_Dhl,\n  input   [3:0] alu_fn_Xhl,\n  input   [2:0] muldivreq_msg_fn_Xhl,\n  input         muldivreq_val,\n  output        muldivreq_rdy,\n  output        muldivresp_val,\n  input         muldivresp_rdy,\n  input         muldiv_mux_sel_Xhl,\n  input         execute_mux_sel_Xhl,\n  input   [2:0] dmemresp_mux_sel_Mhl,\n  input         wb_mux_sel_Mhl,\n  input         rf_wen_Whl,\n  input  [ 4:0] rf_waddr_Whl,\n  input         squash_Fhl,  \n  input         stall_Fhl,\n  input         stall_Dhl,\n  input         stall_Xhl,\n  input         stall_Mhl,\n  input         stall_Whl,\n\n  // Control Signals (dpath->ctrl)\n\n  output        branch_cond_eq_Xhl,\n  output        branch_cond_ne_Xhl,\n  output        branch_cond_lt_Xhl,\n  output        branch_cond_ltu_Xhl,\n  output        branch_cond_ge_Xhl,\n  output        branch_cond_geu_Xhl,\n  output [31:0] proc2csr_data_Whl\n);\n\n  //--------------------------------------------------------------------\n  // PC Logic Stage\n  //--------------------------------------------------------------------\n\n  // PC mux\n\n  wire [31:0] pc_plus4_Phl;\n  wire [31:0] branch_targ_Phl;\n  wire [31:0] jump_targ_Phl;\n  wire [31:0] jumpreg_targ_Phl;\n  wire [31:0] pc_mux_out_Phl;\n\n  wire [31:0] reset_vector = 32'h00080000;\n\n  // Pull mux inputs from later stages\n\n  assign pc_plus4_Phl       = pc_plus4_Fhl;\n  assign branch_targ_Phl    = branch_targ_Xhl;\n  assign jump_targ_Phl      = jump_targ_Dhl;\n  assign jumpreg_targ_Phl   = jumpreg_targ_Dhl;\n\n  assign pc_mux_out_Phl\n    = ( pc_mux_sel_Phl == 2'd0 ) ? pc_plus4_Phl\n    : ( pc_mux_sel_Phl == 2'd1 ) ? branch_targ_Phl\n    : ( pc_mux_sel_Phl == 2'd2 ) ? jump_targ_Phl\n    : ( pc_mux_sel_Phl == 2'd3 ) ? jumpreg_targ_Phl\n    :                              32'bx;\n\n  // Since ID and EX stage don't stall with IF stage anymore, \n  // when branch taken happens, the correct pc (pc_mux_out_Phl) only lasts for a cycle.\n  // so we have to latch it, and use it after the in-flight imem request comes back\n  reg        pc_redirect_pending;\n  reg [31:0] pc_redirect_targ;\n\n  always @ (posedge clk) begin\n    if (reset) begin\n      pc_redirect_pending \u003c= 1'b0;\n      pc_redirect_targ    \u003c= 32'b0;\n    end\n    else if (!stall_Fhl) begin\n      pc_redirect_pending \u003c= 1'b0;\n    end\n    else if (squash_Fhl) begin\n      // latch the correct pc, redirect to it after the in-flight imem req comes back\n      pc_redirect_targ    \u003c= pc_mux_out_Phl;\n      pc_redirect_pending \u003c= 1'b1;\n    end\n  end\n\n  wire [31:0] pc_mux_out_Phl_final\n    = pc_redirect_pending ? pc_redirect_targ : pc_mux_out_Phl;\n\n  // Send out imem request early\n\n  assign imemreq_msg_addr\n    = ( imem_initial_fetch_Fhl ) ? reset_vector\n    :                              pc_mux_out_Phl_final;\n  //----------------------------------------------------------------------\n  // F \u003c- P\n  //----------------------------------------------------------------------\n\n  reg  [31:0] pc_Fhl;\n\n  always @ (posedge clk) begin\n    if( reset ) begin\n      pc_Fhl \u003c= reset_vector;\n    end\n    else if( !stall_Fhl ) begin\n      pc_Fhl \u003c= pc_mux_out_Phl_final;\n    end\n  end\n\n  //--------------------------------------------------------------------\n  // Fetch Stage\n  //--------------------------------------------------------------------\n\n  // PC incrementer\n\n  wire [31:0] pc_plus4_Fhl;\n\n  assign pc_plus4_Fhl = pc_Fhl + 32'd4;\n\n  //----------------------------------------------------------------------\n  // D \u003c- F\n  //----------------------------------------------------------------------\n\n  reg [31:0] pc_Dhl;\n  reg [31:0] pc_plus4_Dhl;\n\n  always @ (posedge clk) begin\n    if( !stall_Dhl ) begin\n      pc_Dhl       \u003c= pc_Fhl;\n      pc_plus4_Dhl \u003c= pc_plus4_Fhl;\n    end\n  end\n\n  //--------------------------------------------------------------------\n  // Decode Stage (Register Read)\n  //--------------------------------------------------------------------\n\n  // Parse instruction fields\n\n  wire   [4:0] inst_rs1_Dhl;\n  wire   [4:0] inst_rs2_Dhl;\n  wire   [4:0] inst_rd_Dhl;\n  wire   [4:0] inst_shamt_Dhl;\n  wire  [31:0] imm_i_Dhl;\n  wire  [31:0] imm_u_Dhl;\n  wire  [31:0] imm_uj_Dhl;\n  wire  [31:0] imm_s_Dhl;\n  wire  [31:0] imm_sb_Dhl;\n\n  // Branch and jump address generation\n\n  wire [31:0] branch_targ_Dhl;\n  wire [31:0] jump_targ_Dhl;\n\n  assign branch_targ_Dhl = pc_Dhl + imm_sb_Dhl;\n  assign jump_targ_Dhl   = pc_Dhl + imm_uj_Dhl;\n\n  // Register file\n\n  wire [ 4:0] rf_raddr0_Dhl = inst_rs1_Dhl;\n  wire [31:0] rf_rdata0_Dhl;\n  wire [ 4:0] rf_raddr1_Dhl = inst_rs2_Dhl;\n  wire [31:0] rf_rdata1_Dhl;\n\n  // Jump reg address\n\n  wire [31:0] jumpreg_targ_Dhl;\n\n  wire [31:0] jumpreg_targ_pretruncate_Dhl = rf_rdata0_Dhl + imm_i_Dhl;\n  assign jumpreg_targ_Dhl  = {jumpreg_targ_pretruncate_Dhl[31:1], 1'b0};\n\n  // Shift amount immediate\n\n  wire [31:0] shamt_Dhl = { 27'b0, inst_shamt_Dhl };\n\n  // Constant operand mux inputs\n\n  wire [31:0] const0    = 32'd0;\n\n  // Operand 0 mux\n\n  wire [31:0] op0_mux_out_Dhl\n    = ( op0_mux_sel_Dhl == 2'd0 ) ? rf_rdata0_Dhl\n    : ( op0_mux_sel_Dhl == 2'd1 ) ? pc_Dhl\n    : ( op0_mux_sel_Dhl == 2'd2 ) ? pc_plus4_Dhl\n    : ( op0_mux_sel_Dhl == 2'd3 ) ? const0\n    :                               32'bx;\n\n  // Operand 1 mux\n\n  wire [31:0] op1_mux_out_Dhl\n    = ( op1_mux_sel_Dhl == 3'd0 ) ? rf_rdata1_Dhl\n    : ( op1_mux_sel_Dhl == 3'd1 ) ? shamt_Dhl\n    : ( op1_mux_sel_Dhl == 3'd2 ) ? imm_u_Dhl\n    : ( op1_mux_sel_Dhl == 3'd3 ) ? imm_sb_Dhl\n    : ( op1_mux_sel_Dhl == 3'd4 ) ? imm_i_Dhl\n    : ( op1_mux_sel_Dhl == 3'd5 ) ? imm_s_Dhl\n    : ( op1_mux_sel_Dhl == 3'd6 ) ? const0\n    :                               32'bx;\n\n  // wdata with bypassing\n\n  wire [31:0] wdata_Dhl = rf_rdata1_Dhl;\n\n  //----------------------------------------------------------------------\n  // X \u003c- D\n  //----------------------------------------------------------------------\n\n  reg [31:0] pc_Xhl;\n  reg [31:0] branch_targ_Xhl;\n  reg [31:0] op0_mux_out_Xhl;\n  reg [31:0] op1_mux_out_Xhl;\n  reg [31:0] wdata_Xhl;\n\n  always @ (posedge clk) begin\n    if( !stall_Xhl ) begin\n      pc_Xhl          \u003c= pc_Dhl;\n      branch_targ_Xhl \u003c= branch_targ_Dhl;\n      op0_mux_out_Xhl \u003c= op0_mux_out_Dhl;\n      op1_mux_out_Xhl \u003c= op1_mux_out_Dhl;\n      wdata_Xhl       \u003c= wdata_Dhl;\n    end\n  end\n\n  //----------------------------------------------------------------------\n  // Execute Stage\n  //----------------------------------------------------------------------\n\n  // ALU\n\n  wire [31:0] alu_out_Xhl;\n\n  // Branch condition logic\n\n  wire   diffSigns_Xhl         = op0_mux_out_Xhl[31] ^ op1_mux_out_Xhl[31];\n  assign branch_cond_eq_Xhl    = ( alu_out_Xhl == 32'd0 );\n  assign branch_cond_ne_Xhl    = ~branch_cond_eq_Xhl;\n  assign branch_cond_lt_Xhl    = diffSigns_Xhl ? op0_mux_out_Xhl[31] : alu_out_Xhl[31];\n  assign branch_cond_ltu_Xhl   = diffSigns_Xhl ? op1_mux_out_Xhl[31] : alu_out_Xhl[31];\n  assign branch_cond_ge_Xhl    = diffSigns_Xhl ? op1_mux_out_Xhl[31] : ~alu_out_Xhl[31];\n  assign branch_cond_geu_Xhl   = diffSigns_Xhl ? op0_mux_out_Xhl[31] : ~alu_out_Xhl[31];\n\n  // Send out memory request during X, response returns in M\n\n  assign dmemreq_msg_addr = alu_out_Xhl;\n  assign dmemreq_msg_data = wdata_Xhl;\n\n  // Muldiv Unit\n\n  wire [63:0] muldivresp_msg_result_Xhl;\n\n  // Muldiv Result Mux\n\n  wire [31:0] muldiv_mux_out_Xhl\n    = ( muldiv_mux_sel_Xhl == 1'd0 ) ? muldivresp_msg_result_Xhl[31:0]\n    : ( muldiv_mux_sel_Xhl == 1'd1 ) ? muldivresp_msg_result_Xhl[63:32]\n    :                                  32'bx;\n\n  // Execute Result Mux\n\n  wire [31:0] execute_mux_out_Xhl\n    = ( execute_mux_sel_Xhl == 1'd0 ) ? alu_out_Xhl\n    : ( execute_mux_sel_Xhl == 1'd1 ) ? muldiv_mux_out_Xhl\n    :                                   32'bx;\n\n  //----------------------------------------------------------------------\n  // M \u003c- X\n  //----------------------------------------------------------------------\n\n  reg  [31:0] pc_Mhl;\n  reg  [31:0] execute_mux_out_Mhl;\n  reg  [31:0] wdata_Mhl;\n\n  always @ (posedge clk) begin\n    if( !stall_Mhl ) begin\n      pc_Mhl              \u003c= pc_Xhl;\n      execute_mux_out_Mhl \u003c= execute_mux_out_Xhl;\n      wdata_Mhl           \u003c= wdata_Xhl;\n    end\n  end\n\n  //----------------------------------------------------------------------\n  // Memory Stage\n  //----------------------------------------------------------------------\n\n  // Data memory subword adjustment mux\n\n  wire [31:0] dmemresp_lb_Mhl\n    = { {24{dmemresp_msg_data[7]}}, dmemresp_msg_data[7:0] };\n\n  wire [31:0] dmemresp_lbu_Mhl\n    = { {24{1'b0}}, dmemresp_msg_data[7:0] };\n\n  wire [31:0] dmemresp_lh_Mhl\n    = { {16{dmemresp_msg_data[15]}}, dmemresp_msg_data[15:0] };\n\n  wire [31:0] dmemresp_lhu_Mhl\n    = { {16{1'b0}}, dmemresp_msg_data[15:0] };\n\n  wire [31:0] dmemresp_mux_out_Mhl\n    = ( dmemresp_mux_sel_Mhl == 3'd0 ) ? dmemresp_msg_data\n    : ( dmemresp_mux_sel_Mhl == 3'd1 ) ? dmemresp_lb_Mhl\n    : ( dmemresp_mux_sel_Mhl == 3'd2 ) ? dmemresp_lbu_Mhl\n    : ( dmemresp_mux_sel_Mhl == 3'd3 ) ? dmemresp_lh_Mhl\n    : ( dmemresp_mux_sel_Mhl == 3'd4 ) ? dmemresp_lhu_Mhl\n    :                                    32'bx;\n\n\n  //----------------------------------------------------------------------\n  // Writeback mux\n  //----------------------------------------------------------------------\n\n  wire [31:0] wb_mux_out_Mhl\n    = ( wb_mux_sel_Mhl == 1'd0 ) ? execute_mux_out_Mhl\n    : ( wb_mux_sel_Mhl == 1'd1 ) ? dmemresp_mux_out_Mhl\n    :                              32'bx;\n\n  //----------------------------------------------------------------------\n  // W \u003c- M\n  //----------------------------------------------------------------------\n\n  reg  [31:0] pc_Whl;\n  reg  [31:0] wb_mux_out_Whl;\n\n  always @ (posedge clk) begin\n    if( !stall_Whl ) begin\n      pc_Whl                 \u003c= pc_Mhl;\n      wb_mux_out_Whl         \u003c= wb_mux_out_Mhl;\n    end\n  end\n\n  //----------------------------------------------------------------------\n  // Writeback Stage\n  //----------------------------------------------------------------------\n\n  // CSR write data\n\n  assign proc2csr_data_Whl = wb_mux_out_Whl;\n\n  //----------------------------------------------------------------------\n  // Debug registers for instruction disassembly\n  //----------------------------------------------------------------------\n\n  reg [31:0] pc_debug;\n\n  always @ ( posedge clk ) begin\n    pc_debug \u003c= pc_Whl;\n  end\n  \n  //----------------------------------------------------------------------\n  // Submodules\n  //----------------------------------------------------------------------\n  \n  // Address Generation\n\n  riscv_InstMsgFromBits inst_msg_from_bits\n  (\n    .msg      (inst_Dhl),\n    .opcode   (),\n    .rs1      (inst_rs1_Dhl),\n    .rs2      (inst_rs2_Dhl),\n    .rd       (inst_rd_Dhl),\n    .funct3   (),\n    .funct7   (),\n    .shamt    (inst_shamt_Dhl),\n    .imm_i    (imm_i_Dhl),\n    .imm_s    (imm_s_Dhl),\n    .imm_sb   (imm_sb_Dhl),\n    .imm_u    (imm_u_Dhl),\n    .imm_uj   (imm_uj_Dhl)\n  );\n\n  // Register File\n\n  riscv_CoreDpathRegfile rfile\n  (\n    .clk     (clk),\n    .raddr0  (rf_raddr0_Dhl),\n    .rdata0  (rf_rdata0_Dhl),\n    .raddr1  (rf_raddr1_Dhl),\n    .rdata1  (rf_rdata1_Dhl),\n    .wen_p   (rf_wen_Whl),\n    .waddr_p (rf_waddr_Whl),\n    .wdata_p (wb_mux_out_Whl)\n  );\n\n  // ALU\n\n  riscv_CoreDpathAlu alu\n  (\n    .in0  (op0_mux_out_Xhl),\n    .in1  (op1_mux_out_Xhl),\n    .fn   (alu_fn_Xhl),\n    .out  (alu_out_Xhl)\n  );\n\n  // Multiplier/Divider\n\n  imuldiv_IntMulDivIterative imuldiv\n  (\n    .clk                   (clk),\n    .reset                 (reset),\n    .muldivreq_msg_fn      (muldivreq_msg_fn_Xhl),\n    .muldivreq_msg_a       (op0_mux_out_Xhl),\n    .muldivreq_msg_b       (op1_mux_out_Xhl),\n    .muldivreq_val         (muldivreq_val),\n    .muldivreq_rdy         (muldivreq_rdy),\n    .muldivresp_msg_result (muldivresp_msg_result_Xhl),\n    .muldivresp_val        (muldivresp_val),\n    .muldivresp_rdy        (muldivresp_rdy)\n  );\n\nendmodule\n\n`endif\n\n// vim: set textwidth=0 ts=2 sw=2 sts=2 :"}, "C": {"name": "riscvstall-CoreCtrl.v", "path": "lab1/riscvstall/riscvstall-CoreCtrl.v", "text": "//=========================================================================\n// 5-Stage RISCV-minimal Control Unit\n//=========================================================================\n\n`ifndef RISCV_CORE_CTRL_V\n`define RISCV_CORE_CTRL_V\n\n`include \"riscvstall-InstMsg.v\"\n\nmodule riscv_CoreCtrl\n(\n  input               clk,\n  input               reset,\n\n  // Instruction Memory Port\n  output              imemreq_val,\n  input               imemreq_rdy,\n  input       [31:0]  imemresp_msg_data,\n  input               imemresp_val,\n  output              imemresp_rdy,\n  output reg          imem_initial_fetch_Fhl,\n  output reg          imemreq_pending_Fhl,\n  // Data Memory Port\n\n  output              dmemreq_msg_rw,\n  output      [1:0]   dmemreq_msg_len,\n  output              dmemreq_val,\n  input               dmemreq_rdy,\n  input               dmemresp_val,\n  output              dmemresp_rdy,\n  // Controls Signals (ctrl->dpath)\n\n  output      [1:0]   pc_mux_sel_Phl,\n  output      [1:0]   op0_mux_sel_Dhl,\n  output      [2:0]   op1_mux_sel_Dhl,\n  output      [31:0]  inst_Dhl,\n  output reg  [3:0]   alu_fn_Xhl,\n  output reg  [2:0]   muldivreq_msg_fn_Xhl,\n  output              muldivreq_val,\n  input               muldivreq_rdy,\n  input               muldivresp_val,\n  output              muldivresp_rdy,\n  output reg          muldiv_mux_sel_Xhl,\n  output reg          execute_mux_sel_Xhl,\n  output reg  [2:0]   dmemresp_mux_sel_Mhl,\n  output reg          wb_mux_sel_Mhl,\n  output              rf_wen_out_Whl,\n  output reg  [4:0]   rf_waddr_Whl,\n  output              squash_Fhl,  \n  output              stall_Fhl,\n  output              stall_Dhl,\n  output              stall_Xhl,\n  output              stall_Mhl,\n  output              stall_Whl,\n\n  // Control Signals (dpath->ctrl)\n\n  input               branch_cond_eq_Xhl,\n  input               branch_cond_ne_Xhl,\n  input               branch_cond_lt_Xhl,\n  input               branch_cond_ltu_Xhl,\n  input               branch_cond_ge_Xhl,\n  input               branch_cond_geu_Xhl,\n  input       [31:0]  proc2csr_data_Whl,\n\n  // CSR Status\n\n  output reg  [31:0]  csr_status,\n\n  // Retire Interface\n\n  output            retire_valid  \n);\n\n  //----------------------------------------------------------------------\n  // PC Stage: Instruction Memory Request\n  //----------------------------------------------------------------------\n\n  // PC Mux Select\n\n  assign pc_mux_sel_Phl\n    = brj_taken_Xhl    ? pm_b\n    : brj_taken_Dhl    ? pc_mux_sel_Dhl\n    :                    pm_p;\n\n  // Dummy Squash Signal\n\n  wire squash_Phl = 1'b0;\n\n  // Stall in PC if F is stalled\n\n  wire stall_Phl = stall_Fhl;\n\n  // Next bubble bit\n\n  wire bubble_next_Phl = ( squash_Phl || stall_Phl );\n\n  //----------------------------------------------------------------------\n  // F \u003c- P\n  //----------------------------------------------------------------------\n\n  reg bubble_Fhl;\n\n  always @ (posedge clk) begin\n    // Only pipeline the bubble bit if the next stage is not stalled\n    if (reset) begin\n      bubble_Fhl \u003c= 1'b0;\n    end\n    else if(!stall_Fhl) begin\n      bubble_Fhl \u003c= bubble_next_Phl;\n    end\n  end\n\n  //----------------------------------------------------------------------\n  // Fetch Stage: Instruction Memory Response\n  //----------------------------------------------------------------------\n\n\n  localparam imem_idle = 1'b0;\n  localparam imem_wait = 1'b1;\n\n  // imem_idle: no pending imem read\n  // imem_wait: there's a imem read on the fly (between req and resp handshakes)\n  reg imem_state_Fhl;\n  always @ (posedge clk) begin\n    if (reset) begin\n      imem_state_Fhl \u003c= imem_idle;\n    end\n    else if (imem_send_accepted_Fhl) begin\n      imem_state_Fhl \u003c= imem_wait;\n    end\n    else if (imem_consumed_Fhl) begin\n      imem_state_Fhl \u003c= imem_idle;\n    end\n  end\n\n  always @(posedge clk) begin\n    if (reset) begin\n      imem_initial_fetch_Fhl \u003c= 1'b1;\n    end\n    else if (imem_send_accepted_Fhl) begin\n      imem_initial_fetch_Fhl \u003c= 1'b0;\n    end\n  end\n\n  // req handshake\n  wire imem_send_accepted_Fhl = imemreq_val && imemreq_rdy;\n\n  // resp handshake\n  wire imem_consumed_Fhl = imemresp_val && imemresp_rdy;\n\n  wire imem_ready_to_send_Fhl\n    = (imem_state_Fhl == imem_idle) || imem_consumed_Fhl;\n\n  // 1 if there's a new imem request\n  wire imemreq_start_Fhl\n    = !stall_Dhl && imem_ready_to_send_Fhl;\n\n  // 1 if the imem reqeust is not accepted yet\n  always @ (posedge clk) begin\n    if (reset) begin\n      imemreq_pending_Fhl \u003c= 1'b0;\n    end\n    else if (imem_send_accepted_Fhl) begin\n      imemreq_pending_Fhl \u003c= 1'b0;\n    end\n    else if (imemreq_start_Fhl) begin\n      imemreq_pending_Fhl \u003c= 1'b1;\n    end\n  end\n\n  // req_val has to stay high while the request is pending\n  assign imemreq_val = imemreq_pending_Fhl || imemreq_start_Fhl;\n\n\n  //---------------------------------\n  // Other signals\n  //---------------------------------\n\n  // Is the current stage valid?\n\n  wire inst_val_Fhl = (!bubble_Fhl && !squash_Fhl);\n\n  // Squash instruction in F stage if branch taken for a valid\n  // instruction or if there was an exception in X stage\n\n  assign squash_Fhl\n    = (inst_val_Dhl && brj_taken_Dhl)\n   || (inst_val_Xhl && brj_taken_Xhl);\n\n\n  // Stall F whenever it doesn't hold a freshly consumable response\n\n  wire stall_imem_Fhl = !imemresp_val;\n\n  assign stall_Fhl = stall_Dhl || stall_imem_Fhl;\n\n\n  // If IF is reading imem and EX decides to take branch, the current imem request needs to be squashed when it comes back!!!\n\n  // Latch that indicates the currently in-flight request (if any) is/was squashed\n  reg imem_abandoned_Fhl;\n  always @ (posedge clk) begin\n    if (reset) begin\n      imem_abandoned_Fhl \u003c= 1'b0;\n    end\n    else if (imem_consumed_Fhl) begin\n      imem_abandoned_Fhl \u003c= 1'b0;\n    end\n    else if ( squash_Fhl\n           && ( ( imem_state_Fhl == imem_wait )\n             || imemreq_pending_Fhl\n             || imem_send_accepted_Fhl ) ) begin\n      imem_abandoned_Fhl \u003c= 1'b1;\n    end\n  end\n\n  // Next bubble bit\n\n  wire bubble_sel_Fhl  = ( squash_Fhl || stall_Fhl || imem_abandoned_Fhl );\n  wire bubble_next_Fhl = ( !bubble_sel_Fhl ) ? bubble_Fhl\n                       : ( bubble_sel_Fhl )  ? 1'b1\n                       :                       1'bx;\n\n\n  assign imemresp_rdy = !stall_Dhl;\n\n  //----------------------------------------------------------------------\n  // D \u003c- F\n  //----------------------------------------------------------------------\n\n  reg [31:0] ir_Dhl;\n  reg        bubble_Dhl;\n\n  always @ ( posedge clk ) begin\n    if ( reset ) begin\n      bubble_Dhl \u003c= 1'b1;\n    end\n    else if( !stall_Dhl ) begin\n      ir_Dhl     \u003c= imemresp_msg_data;\n      bubble_Dhl \u003c= bubble_next_Fhl;\n    end\n  end\n\n  //----------------------------------------------------------------------\n  // Decode Stage: Constants\n  //----------------------------------------------------------------------\n\n  // Generic Parameters\n\n  localparam n = 1'd0;\n  localparam y = 1'd1;\n\n  // Register specifiers\n\n  localparam rx = 5'bx;\n  localparam r0 = 5'd0;\n\n  // Branch Type\n\n  localparam br_x    = 3'bx;\n  localparam br_none = 3'd0;\n  localparam br_beq  = 3'd1;\n  localparam br_bne  = 3'd2;\n  localparam br_blt  = 3'd3;\n  localparam br_bltu = 3'd4;\n  localparam br_bge  = 3'd5;\n  localparam br_bgeu = 3'd6;\n\n  // PC Mux Select\n\n  localparam pm_x   = 2'bx;  // Don't care\n  localparam pm_p   = 2'd0;  // Use pc+4\n  localparam pm_b   = 2'd1;  // Use branch address\n  localparam pm_j   = 2'd2;  // Use jump address\n  localparam pm_r   = 2'd3;  // Use jump register\n\n  // Operand 0 Mux Select\n\n  localparam am_x     = 2'bx;\n  localparam am_rdat  = 2'd0; // Use output of bypass mux for rs1\n  localparam am_pc    = 2'd1; // Use current PC\n  localparam am_pc4   = 2'd2; // Use PC + 4\n  localparam am_0     = 2'd3; // Use constant 0\n\n  // Operand 1 Mux Select\n\n  localparam bm_x      = 3'bx; // Don't care\n  localparam bm_rdat   = 3'd0; // Use output of bypass mux for rs2\n  localparam bm_shamt  = 3'd1; // Use shift amount\n  localparam bm_imm_u  = 3'd2; // Use U-type immediate\n  localparam bm_imm_sb = 3'd3; // Use SB-type immediate\n  localparam bm_imm_i  = 3'd4; // Use I-type immediate\n  localparam bm_imm_s  = 3'd5; // Use S-type immediate\n  localparam bm_0      = 3'd6; // Use constant 0\n\n  // ALU Function\n\n  localparam alu_x    = 4'bx;\n  localparam alu_add  = 4'd0;\n  localparam alu_sub  = 4'd1;\n  localparam alu_sll  = 4'd2;\n  localparam alu_or   = 4'd3;\n  localparam alu_lt   = 4'd4;\n  localparam alu_ltu  = 4'd5;\n  localparam alu_and  = 4'd6;\n  localparam alu_xor  = 4'd7;\n  localparam alu_nor  = 4'd8;\n  localparam alu_srl  = 4'd9;\n  localparam alu_sra  = 4'd10;\n\n  // Muldiv Function\n\n  localparam md_x    = 3'bx;\n  localparam md_mul  = 3'd0;\n  localparam md_div  = 3'd1;\n  localparam md_divu = 3'd2;\n  localparam md_rem  = 3'd3;\n  localparam md_remu = 3'd4;\n\n  // MulDiv Mux Select\n\n  localparam mdm_x = 1'bx; // Don't Care\n  localparam mdm_l = 1'd0; // Take lower half of 64-bit result, mul/div/divu\n  localparam mdm_u = 1'd1; // Take upper half of 64-bit result, rem/remu\n\n  // Execute Mux Select\n\n  localparam em_x   = 1'bx; // Don't Care\n  localparam em_alu = 1'd0; // Use ALU output\n  localparam em_md  = 1'd1; // Use muldiv output\n\n  // Memory Request Type\n\n  localparam nr = 2'b0; // No request\n  localparam ld = 2'd1; // Load\n  localparam st = 2'd2; // Store\n\n  // Subword Memop Length\n\n  localparam ml_x  = 2'bx;\n  localparam ml_w  = 2'd0;\n  localparam ml_b  = 2'd1;\n  localparam ml_h  = 2'd2;\n\n  // Memory Response Mux Select\n\n  localparam dmm_x  = 3'bx;\n  localparam dmm_w  = 3'd0;\n  localparam dmm_b  = 3'd1;\n  localparam dmm_bu = 3'd2;\n  localparam dmm_h  = 3'd3;\n  localparam dmm_hu = 3'd4;\n\n  // Writeback Mux 1\n\n  localparam wm_x   = 1'bx; // Don't care\n  localparam wm_alu = 1'd0; // Use ALU output\n  localparam wm_mem = 1'd1; // Use data memory response\n\n  //----------------------------------------------------------------------\n  // Decode Stage: Logic\n  //----------------------------------------------------------------------\n\n  // Is the current stage valid?\n\n  wire inst_val_Dhl = ( !bubble_Dhl && !squash_Dhl );\n\n  // Ship instruction for field parsing to datapath\n\n  assign inst_Dhl = ir_Dhl;\n\n  // Parse instruction fields\n\n  wire   [4:0] inst_rs1_Dhl;\n  wire   [4:0] inst_rs2_Dhl;\n  wire   [4:0] inst_rd_Dhl;\n\n  riscv_InstMsgFromBits inst_msg_from_bits\n  (\n    .msg      (ir_Dhl),\n    .opcode   (),\n    .rs1      (inst_rs1_Dhl),\n    .rs2      (inst_rs2_Dhl),\n    .rd       (inst_rd_Dhl),\n    .funct3   (),\n    .funct7   (),\n    .shamt    (),\n    .imm_i    (),\n    .imm_s    (),\n    .imm_sb   (),\n    .imm_u    (),\n    .imm_uj   ()\n  );\n\n  // Shorten register specifier name for table\n\n  wire [4:0] rs1 = inst_rs1_Dhl;\n  wire [4:0] rs2 = inst_rs2_Dhl;\n  wire [4:0] rd  = inst_rd_Dhl;\n\n  // Instruction Decode\n\n  localparam cs_sz = `RISCV_INST_MSG_CS_SZ;\n  reg [cs_sz-1:0] cs;\n\n  always @ (*) begin\n\n    cs = {cs_sz{1'bx}}; // Default to invalid instruction\n\n    casez ( ir_Dhl )\n\n      //                                j     br       pc      op0      rs1 op1       rs2 alu       md       md md     ex      mem  mem   memresp wb      rf      csr\n      //                            val taken type     muxsel  muxsel   en  muxsel    en  fn        fn       en muxsel muxsel  rq   len   muxsel  muxsel  wen wa  wen\n      `RISCV_INST_MSG_LUI     :cs={ y,  n,    br_none, pm_p,   am_0,    n,  bm_imm_u, n,  alu_add,  md_x,    n, mdm_x, em_alu, nr,  ml_x, dmm_x,  wm_alu, y,  rd, n   };\n      `RISCV_INST_MSG_AUIPC   :cs={ y,  n,    br_none, pm_p,   am_pc,   n,  bm_imm_u, n,  alu_add,  md_x,    n, mdm_x, em_alu, nr,  ml_x, dmm_x,  wm_alu, y,  rd, n   };\n\n      `RISCV_INST_MSG_ADDI    :cs={ y,  n,    br_none, pm_p,   am_rdat, y,  bm_imm_i, n,  alu_add,  md_x,    n, mdm_x, em_alu, nr,  ml_x, dmm_x,  wm_alu, y,  rd, n   };\n      `RISCV_INST_MSG_ORI     :cs={ y,  n,    br_none, pm_p,   am_rdat, y,  bm_imm_i, n,  alu_or,   md_x,    n, mdm_x, em_alu, nr,  ml_x, dmm_x,  wm_alu, y,  rd, n   };\n      // `RISCV_INST_MSG_ANDI    :cs={};\n      // `RISCV_INST_MSG_XORI    :cs={};\n      // `RISCV_INST_MSG_SLTI    :cs={};\n      // `RISCV_INST_MSG_SLTIU   :cs={};\n      // `RISCV_INST_MSG_SLLI    :cs={};\n      // `RISCV_INST_MSG_SRLI    :cs={};\n      // `RISCV_INST_MSG_SRAI    :cs={};\n\n      `RISCV_INST_MSG_ADD     :cs={ y,  n,    br_none, pm_p,   am_rdat, y,  bm_rdat,  y,  alu_add,  md_x,    n, mdm_x, em_alu, nr,  ml_x, dmm_x,  wm_alu, y,  rd, n   };\n      // `RISCV_INST_MSG_SUB     :cs={};\n      // `RISCV_INST_MSG_SLL     :cs={};\n      // `RISCV_INST_MSG_SLT     :cs={};\n      // `RISCV_INST_MSG_SLTU    :cs={};\n      // `RISCV_INST_MSG_XOR     :cs={};\n      // `RISCV_INST_MSG_SRL     :cs={};\n      // `RISCV_INST_MSG_SRA     :cs={};\n      // `RISCV_INST_MSG_OR      :cs={};\n      // `RISCV_INST_MSG_AND     :cs={};\n\n      `RISCV_INST_MSG_LW      :cs={ y,  n,    br_none, pm_p,   am_rdat, y,  bm_imm_i, n,  alu_add,  md_x,    n, mdm_x, em_x,   ld,  ml_w, dmm_w,  wm_mem, y,  rd, n   };\n      `RISCV_INST_MSG_SW      :cs={ y,  n,    br_none, pm_p,   am_rdat, y,  bm_imm_s, y,  alu_add,  md_x,    n, mdm_x, em_x,   st,  ml_w, dmm_w,  wm_mem, n,  rx, n   };\n      // `RISCV_INST_MSG_LB      :cs={};\n      // `RISCV_INST_MSG_LH      :cs={};\n      // `RISCV_INST_MSG_LBU     :cs={};\n      // `RISCV_INST_MSG_LHU     :cs={};\n      // `RISCV_INST_MSG_SB      :cs={};\n      // `RISCV_INST_MSG_SH      :cs={};            \n\n      `RISCV_INST_MSG_JAL     :cs={ y,  y,    br_none, pm_j,   am_pc4,  n,  bm_0,     n,  alu_add,  md_x,    n, mdm_x, em_alu, nr,  ml_x, dmm_x,  wm_alu, y,  rd, n   };\n      // `RISCV_INST_MSG_JALR    :cs={};      \n\n      `RISCV_INST_MSG_BNE     :cs={ y,  n,    br_bne,  pm_b,   am_rdat, y,  bm_rdat,  y,  alu_xor,  md_x,    n, mdm_x, em_x,   nr,  ml_x, dmm_x,  wm_x,   n,  rx, n   };\n      `RISCV_INST_MSG_BLT     :cs={ y,  n,    br_blt,  pm_b,   am_rdat, y,  bm_rdat,  y,  alu_sub,  md_x,    n, mdm_x, em_x,   nr,  ml_x, dmm_x,  wm_x,   n,  rx, n   };\n      // `RISCV_INST_MSG_BEQ     :cs={};\n      // `RISCV_INST_MSG_BLTU    :cs={};\n      // `RISCV_INST_MSG_BGE     :cs={};\n      // `RISCV_INST_MSG_BGEU    :cs={};\n\n      // `RISCV_INST_MSG_MUL     :cs={};\n      // `RISCV_INST_MSG_MULH    :cs={};\n      // `RISCV_INST_MSG_MULHSU  :cs={};\n      // `RISCV_INST_MSG_MULHU   :cs={};\n      // `RISCV_INST_MSG_DIV     :cs={};\n      // `RISCV_INST_MSG_DIVU    :cs={};\n      // `RISCV_INST_MSG_REM     :cs={};\n      // `RISCV_INST_MSG_REMU    :cs={};\n\n      `RISCV_INST_MSG_CSRW    :cs={ y,  n,    br_none, pm_p,   am_rdat, y,  bm_0,     y,  alu_add,  md_x,    n, mdm_x, em_alu, nr,  ml_x, dmm_x,  wm_alu, n,  rx, y   };\n\n    endcase\n\n  end\n\n  // Jump and Branch Controls\n\n  wire       brj_taken_Dhl = ( inst_val_Dhl && !stall_Dhl && cs[`RISCV_INST_MSG_J_EN] );\n  wire [2:0] br_sel_Dhl    = cs[`RISCV_INST_MSG_BR_SEL];\n\n  // PC Mux Select\n\n  wire [1:0] pc_mux_sel_Dhl = cs[`RISCV_INST_MSG_PC_SEL];\n\n  // Operand RF Read Addresses and Enables (using rs or rt?)\n\n  wire [4:0] rs1_addr_Dhl   = inst_rs1_Dhl;\n  wire [4:0] rs2_addr_Dhl   = inst_rs2_Dhl;\n\n  wire       rs1_en_Dhl     = cs[`RISCV_INST_MSG_RS1_EN];\n  wire       rs2_en_Dhl     = cs[`RISCV_INST_MSG_RS2_EN];\n\n  // Operand Mux Select\n\n  assign op0_mux_sel_Dhl = cs[`RISCV_INST_MSG_OP0_SEL];\n  assign op1_mux_sel_Dhl = cs[`RISCV_INST_MSG_OP1_SEL];\n\n  // ALU Function\n\n  wire [3:0] alu_fn_Dhl = cs[`RISCV_INST_MSG_ALU_FN];\n\n  // Muldiv Function\n\n  wire [2:0] muldivreq_msg_fn_Dhl = cs[`RISCV_INST_MSG_MULDIV_FN];\n\n  // Muldiv Controls\n\n  wire muldivreq_val_Dhl = cs[`RISCV_INST_MSG_MULDIV_EN];\n\n  // Muldiv Mux Select\n\n  wire muldiv_mux_sel_Dhl = cs[`RISCV_INST_MSG_MULDIV_SEL];\n\n  // Execute Mux Select\n\n  wire execute_mux_sel_Dhl = cs[`RISCV_INST_MSG_EX_SEL];\n\n  // Memory Controls\n\n  wire       dmemreq_msg_rw_Dhl  = ( cs[`RISCV_INST_MSG_MEM_REQ] == st );\n  wire [1:0] dmemreq_msg_len_Dhl = cs[`RISCV_INST_MSG_MEM_LEN];\n  wire       dmemreq_val_Dhl     = ( cs[`RISCV_INST_MSG_MEM_REQ] != nr );\n\n  // Memory response mux select\n\n  wire [2:0] dmemresp_mux_sel_Dhl = cs[`RISCV_INST_MSG_MEM_SEL];\n\n  // Writeback Mux Select\n\n  wire wb_mux_sel_Dhl = cs[`RISCV_INST_MSG_WB_SEL];\n\n  // Register Writeback Controls\n\n  wire rf_wen_Dhl         = cs[`RISCV_INST_MSG_RF_WEN];\n  wire [4:0] rf_waddr_Dhl = cs[`RISCV_INST_MSG_RF_WADDR];\n\n  // CSR register write enable\n\n  wire csr_wen_Dhl = cs[`RISCV_INST_MSG_CSR_WEN];\n\n  // CSR register address\n\n  wire [11:0] csr_addr_Dhl  = ir_Dhl[31:20];\n\n  //----------------------------------------------------------------------\n  // Squash and Stall Logic\n  //----------------------------------------------------------------------\n\n  // Squash instruction in D if a valid branch in X is taken\n\n  wire squash_Dhl = ( inst_val_Xhl && brj_taken_Xhl );\n\n  // Stall in D if muldiv unit is not ready and there is a valid request\n\n  wire stall_muldiv_Dhl = ( muldivreq_val_Dhl && inst_val_Dhl && !muldivreq_rdy );\n\n  // Stall for data hazards if either of the operand read addresses are\n  // the same as the write addresses of instruction later in the pipeline\n\n  wire stall_hazard_Dhl   = inst_val_Dhl && (\n                            ( rs1_en_Dhl && inst_val_Xhl && rf_wen_Xhl\n                              && ( rs1_addr_Dhl == rf_waddr_Xhl )\n                              && ( rf_waddr_Xhl != 5'd0 ) )\n                         || ( rs1_en_Dhl && inst_val_Mhl && rf_wen_Mhl\n                              && ( rs1_addr_Dhl == rf_waddr_Mhl )\n                              && ( rf_waddr_Mhl != 5'd0 ) )\n                         || ( rs1_en_Dhl && inst_val_Whl && rf_wen_Whl\n                              && ( rs1_addr_Dhl == rf_waddr_Whl )\n                              && ( rf_waddr_Whl != 5'd0 ) )\n                         || ( rs2_en_Dhl && inst_val_Xhl && rf_wen_Xhl\n                              && ( rs2_addr_Dhl == rf_waddr_Xhl )\n                              && ( rf_waddr_Xhl != 5'd0 ) )\n                         || ( rs2_en_Dhl && inst_val_Mhl && rf_wen_Mhl\n                              && ( rs2_addr_Dhl == rf_waddr_Mhl )\n                              && ( rf_waddr_Mhl != 5'd0 ) )\n                         || ( rs2_en_Dhl && inst_val_Whl && rf_wen_Whl\n                              && ( rs2_addr_Dhl == rf_waddr_Whl )\n                              && ( rf_waddr_Whl != 5'd0 ) ) );\n\n  // Aggregate Stall Signal\n\n  assign stall_Dhl = ( stall_Xhl\n                  ||   stall_muldiv_Dhl\n                  ||   stall_hazard_Dhl );\n\n  // Next bubble bit\n\n  wire bubble_sel_Dhl  = ( squash_Dhl || stall_Dhl );\n  wire bubble_next_Dhl = ( !bubble_sel_Dhl ) ? bubble_Dhl\n                       : ( bubble_sel_Dhl )  ? 1'b1\n                       :                       1'bx;\n\n  //----------------------------------------------------------------------\n  // X \u003c- D\n  //----------------------------------------------------------------------\n\n  reg [31:0] ir_Xhl;\n  reg  [2:0] br_sel_Xhl;\n  reg        muldivreq_val_Xhl;\n  reg        dmemreq_msg_rw_Xhl;\n  reg  [1:0] dmemreq_msg_len_Xhl;\n  reg        dmemreq_val_Xhl;\n  reg  [2:0] dmemresp_mux_sel_Xhl;\n  reg        wb_mux_sel_Xhl;\n  reg        rf_wen_Xhl;\n  reg  [4:0] rf_waddr_Xhl;\n  reg        csr_wen_Xhl;\n  reg [11:0] csr_addr_Xhl;\n\n  reg        bubble_Xhl;\n\n  // Pipeline Controls\n\n  always @ ( posedge clk ) begin\n    if ( reset ) begin\n      bubble_Xhl \u003c= 1'b1;\n    end\n    else if( !stall_Xhl ) begin\n      ir_Xhl               \u003c= ir_Dhl;\n      br_sel_Xhl           \u003c= br_sel_Dhl;\n      alu_fn_Xhl           \u003c= alu_fn_Dhl;\n      muldivreq_val_Xhl    \u003c= muldivreq_val_Dhl;\n      muldivreq_msg_fn_Xhl \u003c= muldivreq_msg_fn_Dhl;\n      muldiv_mux_sel_Xhl   \u003c= muldiv_mux_sel_Dhl;\n      execute_mux_sel_Xhl  \u003c= execute_mux_sel_Dhl;\n      dmemreq_msg_rw_Xhl   \u003c= dmemreq_msg_rw_Dhl;\n      dmemreq_msg_len_Xhl  \u003c= dmemreq_msg_len_Dhl;\n      dmemreq_val_Xhl      \u003c= dmemreq_val_Dhl;\n      dmemresp_mux_sel_Xhl \u003c= dmemresp_mux_sel_Dhl;\n      wb_mux_sel_Xhl       \u003c= wb_mux_sel_Dhl;\n      rf_wen_Xhl           \u003c= rf_wen_Dhl;\n      rf_waddr_Xhl         \u003c= rf_waddr_Dhl;\n      csr_wen_Xhl          \u003c= csr_wen_Dhl;\n      csr_addr_Xhl         \u003c= csr_addr_Dhl;\n\n      bubble_Xhl           \u003c= bubble_next_Dhl;\n    end\n\n  end\n\n  //----------------------------------------------------------------------\n  // Execute Stage\n  //----------------------------------------------------------------------\n\n  // Is the current stage valid?\n\n  wire inst_val_Xhl = ( !bubble_Xhl && !squash_Xhl );\n\n  // Muldiv request\n\n  assign muldivreq_val = muldivreq_val_Xhl && inst_val_Xhl;\n  assign muldivresp_rdy = !stall_Xhl;\n\n  // Only send a valid dmem request if not stalled\n\n  assign dmemreq_msg_rw  = dmemreq_msg_rw_Xhl;\n  assign dmemreq_msg_len = dmemreq_msg_len_Xhl;\n  assign dmemreq_val     = ( inst_val_Xhl && !stall_Xhl && dmemreq_val_Xhl );\n\n  // Resolve Branch\n\n  wire bne_taken_Xhl  = ( ( br_sel_Xhl == br_bne ) && branch_cond_ne_Xhl );\n  wire blt_taken_Xhl  = ( ( br_sel_Xhl == br_blt ) && branch_cond_lt_Xhl );\n\n  wire any_br_taken_Xhl\n    = ( bne_taken_Xhl || blt_taken_Xhl\n      );\n\n  wire brj_taken_Xhl = ( inst_val_Xhl && any_br_taken_Xhl );\n\n  // Dummy Squash Signal\n\n  wire squash_Xhl = 1'b0;\n\n  // Stall in X if muldiv reponse is not valid and there was a valid request\n\n  wire stall_muldiv_Xhl = ( muldivreq_val_Xhl && inst_val_Xhl && !muldivresp_val );\n\n  // Stall in X if dmem is not ready and there was a valid request\n\n  wire stall_dmem_Xhl = ( dmemreq_val_Xhl && inst_val_Xhl && !dmemreq_rdy );\n\n  // Aggregate Stall Signal\n\n  assign stall_Xhl = ( stall_Mhl || stall_muldiv_Xhl || stall_dmem_Xhl );\n\n  // Next bubble bit\n\n  wire bubble_sel_Xhl  = ( squash_Xhl || stall_Xhl );\n  wire bubble_next_Xhl = ( !bubble_sel_Xhl ) ? bubble_Xhl\n                       : ( bubble_sel_Xhl )  ? 1'b1\n                       :                       1'bx;\n\n  //----------------------------------------------------------------------\n  // M \u003c- X\n  //----------------------------------------------------------------------\n\n  reg [31:0] ir_Mhl;\n  reg        dmemreq_val_Mhl;\n  reg        rf_wen_Mhl;\n  reg  [4:0] rf_waddr_Mhl;\n  reg        csr_wen_Mhl;\n  reg [11:0] csr_addr_Mhl;\n\n  reg        bubble_Mhl;\n\n  // Pipeline Controls\n\n  always @ ( posedge clk ) begin\n    if ( reset ) begin\n      bubble_Mhl \u003c= 1'b1;\n    end\n    else if( !stall_Mhl ) begin\n      ir_Mhl               \u003c= ir_Xhl;\n      dmemresp_mux_sel_Mhl \u003c= dmemresp_mux_sel_Xhl;\n      wb_mux_sel_Mhl       \u003c= wb_mux_sel_Xhl;\n      rf_wen_Mhl           \u003c= rf_wen_Xhl;\n      rf_waddr_Mhl         \u003c= rf_waddr_Xhl;\n      csr_wen_Mhl          \u003c= csr_wen_Xhl;\n      csr_addr_Mhl         \u003c= csr_addr_Xhl;\n\n      bubble_Mhl           \u003c= bubble_next_Xhl;\n    end\n    dmemreq_val_Mhl \u003c= dmemreq_val;\n  end\n\n  //----------------------------------------------------------------------\n  // Memory Stage\n  //----------------------------------------------------------------------\n\n  // Is current stage valid?\n\n  wire inst_val_Mhl = ( !bubble_Mhl && !squash_Mhl );\n\n  // Dummy Squash Signal\n\n  wire squash_Mhl = 1'b0;\n\n  // Stall in M if memory response is not returned for a valid request\n\n  wire stall_dmem_Mhl = ( !reset && dmemreq_val_Mhl && inst_val_Mhl && !dmemresp_val );\n  \n  // Aggregate Stall Signal\n\n  assign stall_Mhl = stall_dmem_Mhl ;\n\n  // Ready to accept the dmem response exactly when M->X2 will advance;\n  // the memory holds val/msg stable until this is asserted, so there is\n  // no need to locally buffer a response that arrives while stalled.\n\n  assign dmemresp_rdy = !stall_Mhl;\n\n  // Next bubble bit\n\n  wire bubble_sel_Mhl  = ( squash_Mhl || stall_Mhl );\n  wire bubble_next_Mhl = ( !bubble_sel_Mhl ) ? bubble_Mhl\n                       : ( bubble_sel_Mhl )  ? 1'b1\n                       :                       1'bx;\n\n  //----------------------------------------------------------------------\n  // W \u003c- M\n  //----------------------------------------------------------------------\n\n  reg [31:0] ir_Whl;\n  reg        rf_wen_Whl;\n  reg        csr_wen_Whl;\n  reg [11:0] csr_addr_Whl;\n\n  reg        bubble_Whl;\n\n  // Pipeline Controls\n\n  always @ ( posedge clk ) begin\n    if ( reset ) begin\n      bubble_Whl \u003c= 1'b1;\n    end\n    else if( !stall_Whl ) begin\n      ir_Whl           \u003c= ir_Mhl;\n      rf_wen_Whl       \u003c= rf_wen_Mhl;\n      rf_waddr_Whl     \u003c= rf_waddr_Mhl;\n      csr_wen_Whl      \u003c= csr_wen_Mhl;\n      csr_addr_Whl     \u003c= csr_addr_Mhl;\n\n      bubble_Whl       \u003c= bubble_next_Mhl;\n    end\n  end\n\n  //----------------------------------------------------------------------\n  // Writeback Stage\n  //----------------------------------------------------------------------\n\n  // Is current stage valid?\n\n  wire inst_val_Whl = ( !bubble_Whl && !squash_Whl );\n  // An instruction retires when a valid writeback-stage entry advances.\n\n  assign retire_valid = inst_val_Whl && !stall_Whl;\n\n  // Only set register file wen if stage is valid\n\n  assign rf_wen_out_Whl = ( inst_val_Whl && !stall_Whl && rf_wen_Whl );\n\n  // Dummy squahs and stall signals\n\n  wire squash_Whl = 1'b0;\n  assign stall_Whl  = 1'b0;\n\n  //----------------------------------------------------------------------\n  // Debug registers for instruction disassembly\n  //----------------------------------------------------------------------\n\n  reg [31:0] ir_debug;\n  reg        inst_val_debug;\n\n  always @ ( posedge clk ) begin\n    ir_debug       \u003c= ir_Whl;\n    inst_val_debug \u003c= inst_val_Whl;\n  end\n\n  //----------------------------------------------------------------------\n  // CSR register\n  //----------------------------------------------------------------------\n\n  always @ ( posedge clk ) begin\n    if ( reset ) begin\n      csr_status \u003c= 32'b0;\n    end\n    else if ( csr_wen_Whl && inst_val_Whl ) begin\n      case ( csr_addr_Whl )\n        12'd21 : csr_status \u003c= proc2csr_data_Whl;\n      endcase\n    end\n  end\n\n//========================================================================\n// Disassemble instructions\n//========================================================================\n\n  `ifndef SYNTHESIS\n\n  riscv_InstMsgDisasm inst_msg_disasm_D\n  (\n    .msg ( ir_Dhl )\n  );\n\n  riscv_InstMsgDisasm inst_msg_disasm_X\n  (\n    .msg ( ir_Xhl )\n  );\n\n  riscv_InstMsgDisasm inst_msg_disasm_M\n  (\n    .msg ( ir_Mhl )\n  );\n\n  riscv_InstMsgDisasm inst_msg_disasm_W\n  (\n    .msg ( ir_Whl )\n  );\n\n  riscv_InstMsgDisasm inst_msg_disasm_debug\n  (\n    .msg ( ir_debug )\n  );\n\n  `endif\n\n//========================================================================\n// Assertions\n//========================================================================\n// Detect illegal instructions and terminate the simulation if multiple\n// illegal instructions are detected in succession.\n\n  `ifndef SYNTHESIS\n\n  reg overload = 1'b0;\n\n  always @ ( posedge clk ) begin\n    if ( !cs[`RISCV_INST_MSG_INST_VAL] && !reset ) begin\n      $display(\" RTL-ERROR : %m : Illegal instruction!\");\n\n      if ( overload == 1'b1 ) begin\n        $finish;\n      end\n\n      overload = 1'b1;\n    end\n    else begin\n      overload = 1'b0;\n    end\n  end\n\n  `endif\n\nendmodule\n\n`endif\n\n// vim: set textwidth=0 ts=2 sw=2 sts=2 :"}, "K": {"name": "riscvstall-Core.v", "path": "lab1/riscvstall/riscvstall-Core.v", "text": "//=========================================================================\n// 5-Stage RISCV Core\n//=========================================================================\n\n`ifndef RISCV_CORE_V\n`define RISCV_CORE_V\n\n`include \"vc-MemReqMsg.v\"\n`include \"vc-MemRespMsg.v\"\n`include \"riscvstall-CoreCtrl.v\"\n`include \"riscvstall-CoreDpath.v\"\n\nmodule riscv_Core\n(\n  input         clk,\n  input         reset,\n\n  // Instruction Memory Request Port\n\n  output [`VC_MEM_REQ_MSG_SZ(32,32)-1:0] imemreq_msg,\n  output                                 imemreq_val,\n  input                                  imemreq_rdy,\n\n  // Instruction Memory Response Port\n\n  input [`VC_MEM_RESP_MSG_SZ(32)-1:0] imemresp_msg,\n  input                               imemresp_val,\n  output                              imemresp_rdy,\n\n  // Data Memory Request Port\n\n  output [`VC_MEM_REQ_MSG_SZ(32,32)-1:0] dmemreq_msg,\n  output                                 dmemreq_val,\n  input                                  dmemreq_rdy,\n\n  // Data Memory Response Port\n\n  input [`VC_MEM_RESP_MSG_SZ(32)-1:0] dmemresp_msg,\n  input                               dmemresp_val,\n  output                              dmemresp_rdy,\n\n  // CSR Status Register Output to Host\n\n  output [31:0] csr_status,\n\n  // Retire Interface\n\n  output        retire_valid  \n);\n\n  wire [31:0] imemreq_msg_addr;\n  wire [31:0] imemreq_msg_addr_next;\n  wire [31:0] imemresp_msg_data;\n\n  wire        dmemreq_msg_rw;\n  wire  [1:0] dmemreq_msg_len;\n  wire [31:0] dmemreq_msg_addr;\n  wire [31:0] dmemreq_msg_data;\n  wire [31:0] dmemresp_msg_data;\n\n  wire  [1:0] pc_mux_sel_Phl;\n  wire  [1:0] op0_mux_sel_Dhl;\n  wire  [2:0] op1_mux_sel_Dhl;\n  wire [31:0] inst_Dhl;\n  wire  [3:0] alu_fn_Xhl;\n  wire  [2:0] muldivreq_msg_fn_Xhl;\n  wire        muldivreq_val;\n  wire        muldivreq_rdy;\n  wire        muldivresp_val;\n  wire        muldivresp_rdy;\n  wire        muldiv_mux_sel_Xhl;\n  wire        execute_mux_sel_Xhl;\n  wire  [2:0] dmemresp_mux_sel_Mhl;\n  wire        wb_mux_sel_Mhl;\n  wire        rf_wen_Whl;\n  wire  [4:0] rf_waddr_Whl;\n  wire        stall_Fhl;\n  wire        stall_Dhl;\n  wire        stall_Xhl;\n  wire        stall_Mhl;\n  wire        stall_Whl;\n  wire        squash_Fhl;\n  wire        imem_initial_fetch_Fhl;\n  wire        imemreq_pending_Fhl;\n\n  wire        branch_cond_eq_Xhl;\n  wire        branch_cond_ne_Xhl;\n  wire        branch_cond_lt_Xhl;\n  wire        branch_cond_ltu_Xhl;\n  wire        branch_cond_ge_Xhl;\n  wire        branch_cond_geu_Xhl;\n  wire [31:0] proc2csr_data_Whl;\n\n  //----------------------------------------------------------------------\n  // Pack Memory Request Messages\n  //----------------------------------------------------------------------\n  // hold the addr until req handshake finishes (when req_val but !req_rdy)\n\n  reg [31:0] imemreq_msg_addr_hold;\n\n  always @ ( posedge clk ) begin\n    if ( reset ) begin\n      imemreq_msg_addr_hold \u003c= 32'h00080000;\n    end\n    else if ( imemreq_val && !imemreq_pending_Fhl ) begin\n      imemreq_msg_addr_hold \u003c= imemreq_msg_addr_next;\n    end\n  end\n\n  assign imemreq_msg_addr\n    = imemreq_pending_Fhl ? imemreq_msg_addr_hold\n    :                       imemreq_msg_addr_next;\n    \n  vc_MemReqMsgToBits#(32,32) imemreq_msg_to_bits\n  (\n    .type (`VC_MEM_REQ_MSG_TYPE_READ),\n    .addr (imemreq_msg_addr),\n    .len  (2'd0),\n    .data (32'bx),\n    .bits (imemreq_msg)\n  );\n\n  vc_MemReqMsgToBits#(32,32) dmemreq_msg_to_bits\n  (\n    .type (dmemreq_msg_rw),\n    .addr (dmemreq_msg_addr),\n    .len  (dmemreq_msg_len),\n    .data (dmemreq_msg_data),\n    .bits (dmemreq_msg)\n  );\n\n  //----------------------------------------------------------------------\n  // Unpack Memory Response Messages\n  //----------------------------------------------------------------------\n\n  vc_MemRespMsgFromBits#(32) imemresp_msg_from_bits\n  (\n    .bits (imemresp_msg),\n    .type (),\n    .len  (),\n    .data (imemresp_msg_data)\n  );\n\n  vc_MemRespMsgFromBits#(32) dmemresp_msg_from_bits\n  (\n    .bits (dmemresp_msg),\n    .type (),\n    .len  (),\n    .data (dmemresp_msg_data)\n  );\n\n  //----------------------------------------------------------------------\n  // Control Unit\n  //----------------------------------------------------------------------\n\n  riscv_CoreCtrl ctrl\n  (\n    .clk                    (clk),\n    .reset                  (reset),\n\n    // Instruction Memory Port\n\n    .imemreq_val            (imemreq_val),\n    .imemreq_rdy            (imemreq_rdy),\n    .imemresp_msg_data      (imemresp_msg_data),\n    .imemresp_val           (imemresp_val),\n    .imemresp_rdy           (imemresp_rdy),\n    .imem_initial_fetch_Fhl (imem_initial_fetch_Fhl),\n    .imemreq_pending_Fhl    (imemreq_pending_Fhl),\n    // Data Memory Port\n\n    .dmemreq_msg_rw         (dmemreq_msg_rw),\n    .dmemreq_msg_len        (dmemreq_msg_len),\n    .dmemreq_val            (dmemreq_val),\n    .dmemreq_rdy            (dmemreq_rdy),\n    .dmemresp_val           (dmemresp_val),\n    .dmemresp_rdy           (dmemresp_rdy),\n\n    // Controls Signals (ctrl->dpath)\n\n    .pc_mux_sel_Phl         (pc_mux_sel_Phl),\n    .op0_mux_sel_Dhl        (op0_mux_sel_Dhl),\n    .op1_mux_sel_Dhl        (op1_mux_sel_Dhl),\n    .inst_Dhl               (inst_Dhl),\n    .alu_fn_Xhl             (alu_fn_Xhl),\n    .muldivreq_msg_fn_Xhl   (muldivreq_msg_fn_Xhl),\n    .muldivreq_val          (muldivreq_val),\n    .muldivreq_rdy          (muldivreq_rdy),\n    .muldivresp_val         (muldivresp_val),\n    .muldivresp_rdy         (muldivresp_rdy),\n    .muldiv_mux_sel_Xhl     (muldiv_mux_sel_Xhl),\n    .execute_mux_sel_Xhl    (execute_mux_sel_Xhl),\n    .dmemresp_mux_sel_Mhl   (dmemresp_mux_sel_Mhl),\n    .wb_mux_sel_Mhl         (wb_mux_sel_Mhl),\n    .rf_wen_out_Whl         (rf_wen_Whl),\n    .rf_waddr_Whl           (rf_waddr_Whl),\n    .squash_Fhl             (squash_Fhl),    \n    .stall_Fhl              (stall_Fhl),\n    .stall_Dhl              (stall_Dhl),\n    .stall_Xhl              (stall_Xhl),\n    .stall_Mhl              (stall_Mhl),\n    .stall_Whl              (stall_Whl),\n\n    // Control Signals (dpath->ctrl)\n\n    .branch_cond_eq_Xhl\t    (branch_cond_eq_Xhl),\n    .branch_cond_ne_Xhl\t    (branch_cond_ne_Xhl),\n    .branch_cond_lt_Xhl\t    (branch_cond_lt_Xhl),\n    .branch_cond_ltu_Xhl\t  (branch_cond_ltu_Xhl),\n    .branch_cond_ge_Xhl\t    (branch_cond_ge_Xhl),\n    .branch_cond_geu_Xhl\t  (branch_cond_geu_Xhl),\n    .proc2csr_data_Whl      (proc2csr_data_Whl),\n\n    // CSR Status\n\n    .csr_status             (csr_status),\n\n    // Retire Interface\n\n    .retire_valid           (retire_valid)   \n  );\n\n  //----------------------------------------------------------------------\n  // Datapath\n  //----------------------------------------------------------------------\n\n  riscv_CoreDpath dpath\n  (\n    .clk                     (clk),\n    .reset                   (reset),\n\n    // Instruction Memory Port\n\n    .imemreq_msg_addr        (imemreq_msg_addr_next),\n\n    // Data Memory Port\n\n    .dmemreq_msg_addr        (dmemreq_msg_addr),\n    .dmemreq_msg_data        (dmemreq_msg_data),\n    .dmemresp_msg_data       (dmemresp_msg_data),\n\n    // Controls Signals (ctrl->dpath)\n    .imem_initial_fetch_Fhl  (imem_initial_fetch_Fhl),\n    .pc_mux_sel_Phl          (pc_mux_sel_Phl),\n    .op0_mux_sel_Dhl         (op0_mux_sel_Dhl),\n    .op1_mux_sel_Dhl         (op1_mux_sel_Dhl),\n    .inst_Dhl                (inst_Dhl),\n    .alu_fn_Xhl              (alu_fn_Xhl),\n    .muldivreq_msg_fn_Xhl    (muldivreq_msg_fn_Xhl),\n    .muldivreq_val           (muldivreq_val),\n    .muldivreq_rdy           (muldivreq_rdy),\n    .muldivresp_val          (muldivresp_val),\n    .muldivresp_rdy          (muldivresp_rdy),\n    .muldiv_mux_sel_Xhl      (muldiv_mux_sel_Xhl),\n    .execute_mux_sel_Xhl     (execute_mux_sel_Xhl),\n    .dmemresp_mux_sel_Mhl    (dmemresp_mux_sel_Mhl),\n    .wb_mux_sel_Mhl          (wb_mux_sel_Mhl),\n    .rf_wen_Whl              (rf_wen_Whl),\n    .rf_waddr_Whl            (rf_waddr_Whl),\n    .squash_Fhl              (squash_Fhl),    \n    .stall_Fhl               (stall_Fhl),\n    .stall_Dhl               (stall_Dhl),\n    .stall_Xhl               (stall_Xhl),\n    .stall_Mhl               (stall_Mhl),\n    .stall_Whl               (stall_Whl),\n\n    // Control Signals (dpath->ctrl)\n\n    .branch_cond_eq_Xhl\t     (branch_cond_eq_Xhl),\n    .branch_cond_ne_Xhl\t     (branch_cond_ne_Xhl),\n    .branch_cond_lt_Xhl\t     (branch_cond_lt_Xhl),\n    .branch_cond_ltu_Xhl\t (branch_cond_ltu_Xhl),\n    .branch_cond_ge_Xhl\t     (branch_cond_ge_Xhl),\n    .branch_cond_geu_Xhl\t (branch_cond_geu_Xhl),\n    .proc2csr_data_Whl       (proc2csr_data_Whl)\n  );\n\nendmodule\n\n`endif\n\n// vim: set textwidth=0 ts=2 sw=2 sts=2 :"}, "R": {"name": "riscvstall-CoreDpathRegfile.v", "path": "lab1/riscvstall/riscvstall-CoreDpathRegfile.v", "text": "//=========================================================================\n// 5-Stage RISCV Register File\n//=========================================================================\n\n`ifndef RISCV_CORE_DPATH_REGFILE_V\n`define RISCV_CORE_DPATH_REGFILE_V\n\nmodule riscv_CoreDpathRegfile\n(\n  input         clk,\n  input  [ 4:0] raddr0,  // Read 0 address (combinational input)\n  output [31:0] rdata0,  // Read 0 data (combinational on raddr)\n  input  [ 4:0] raddr1,  // Read 1 address (combinational input)\n  output [31:0] rdata1,  // Read 1 data (combinational on raddr)\n  input         wen_p,   // Write enable (sample on rising clk edge)\n  input  [ 4:0] waddr_p, // Write address (sample on rising clk edge)\n  input  [31:0] wdata_p  // Write data (sample on rising clk edge)\n);\n\n  // We use an array of 32 bit register for the regfile itself\n  reg [31:0] registers[31:0];\n\n  // Combinational read ports\n  assign rdata0 = ( raddr0 == 0 ) ? 32'b0 : registers[raddr0];\n  assign rdata1 = ( raddr1 == 0 ) ? 32'b0 : registers[raddr1];\n\n  // Write port is active only when wen is asserted\n  always @( posedge clk )\n  begin\n    if ( wen_p && (waddr_p != 5'b0) )\n      registers[waddr_p] \u003c= wdata_p;\n  end\n\nendmodule\n\n`endif"}, "A": {"name": "riscvstall-CoreDpathAlu.v", "path": "lab1/riscvstall/riscvstall-CoreDpathAlu.v", "text": "//=========================================================================\n// 5-Stage RISCV ALU\n//=========================================================================\n\n`ifndef RISCV_CORE_DPATH_ALU_V\n`define RISCV_CORE_DPATH_ALU_V\n\n//-------------------------------------------------------------------------\n// addsub unit\n//-------------------------------------------------------------------------\n\nmodule riscv_CoreDpathAluAddSub\n(\n  input      [ 1:0] addsub_fn, // 00 = add, 01 = sub, 10 = slt, 11 = sltu\n  input      [31:0] alu_a,     // A operand\n  input      [31:0] alu_b,     // B operand\n  output reg [31:0] result     // result\n);\n\n  // We use one adder to perform both additions and subtractions\n  wire [31:0] xB  = ( addsub_fn != 2'b00 ) ? ( ~alu_b + 1 ) : alu_b;\n  wire [31:0] sum = alu_a + xB;\n\n  wire diffSigns = alu_a[31] ^ alu_b[31];\n\n  always @(*)\n  begin\n\n    if (( addsub_fn == 2'b00 ) || ( addsub_fn == 2'b01 ))\n      result = sum;\n\n    // Logic for signed set less than\n    else if ( addsub_fn == 2'b10 )\n    begin\n\n      // If the signs of alu_a and alu_b are different then one is\n      // negative and one is positive. If alu_a is the positive one then\n      // it is not less than alu_b, and if alu_a is the negative one then\n      // it is less than alu_b.\n\n      if ( diffSigns )\n        if ( alu_a[31] == 1'b0 )    // alu_a is positive\n          result = { 31'b0, 1'b0 };\n        else                        // alu_a is negative\n          result = { 31'b0, 1'b1 };\n\n      // If the signs of alu_a and alu_b are the same then we look at the\n      // result from (alu_a - alu_b). If this is positive then alu_a is\n      // not less than alu_b, and if this is negative then alu_a is\n      // indeed less than alu_b.\n\n      else\n        if ( sum[31] == 1'b0 )      // (alu_a - alu_b) is positive\n          result = { 31'b0, 1'b0 };\n        else                        // (alu_a - alu_b) is negative\n          result = { 31'b0, 1'b1 };\n\n    end\n\n    // Logic for unsigned set less than\n    else if ( addsub_fn == 2'b11 )\n\n      // If the MSB of alu_a and alu_b are different then the one with a\n      // one in the MSB is greater than the other. If alu_a has a one in\n      // the MSB then it is not less than alu_b, and if alu_a has a zero\n      // in the MSB then it is less than alu_b.\n\n      if ( diffSigns )\n        if ( alu_a[31] == 1'b1 )    // alu_a is the greater one\n          result = { 31'b0, 1'b0 };\n        else                        // alu_a is the smaller one\n          result = { 31'b0, 1'b1 };\n\n      // If the MSB of alu_a and alu_b are the same then we look at the\n      // result from (alu_a - alu_b). If this is positive then alu_a is\n      // not less than alu_b, and if this is negative then alu_a is\n      // indeed less than alu_b.\n\n      else\n        if ( sum[31] == 1'b0 )      // (alu_a - alu_b) is positive\n          result = { 31'b0, 1'b0 };\n        else                        // (alu_a - alu_b) is negative\n          result = { 31'b0, 1'b1 };\n\n    else\n      result = 32'bx;\n\n  end\n\nendmodule\n\n//-------------------------------------------------------------------------\n// shifter unit\n//-------------------------------------------------------------------------\n\nmodule riscv_CoreDpathAluShifter\n(\n  input  [ 1:0] shift_fn,  // 00 = lsl, 01 = lsr, 11 = asr\n  input  [31:0] alu_a,     // Shift ammount\n  input  [31:0] alu_b,     // Operand to shift\n  output [31:0] result     // result\n);\n\n  // We need this to make sure that we get a signed right shift\n  wire signed [31:0] signed_alu_b = alu_b;\n  wire signed [31:0] signed_result = signed_alu_b >>> alu_a[4:0];\n\n  assign result\n    = ( shift_fn == 2'b00 ) ? ( alu_b \u003c\u003c alu_a[4:0] ) :\n      ( shift_fn == 2'b01 ) ? ( alu_b >> alu_a[4:0] ) :\n      ( shift_fn == 2'b11 ) ? signed_result :\n                              ( 32'bx );\n\nendmodule\n\n//-------------------------------------------------------------------------\n// logical unit\n//-------------------------------------------------------------------------\n\nmodule riscv_CoreDpathAluLogical\n(\n  input  [1:0]  logical_fn, // 00 = and, 01 = or, 10 = xor, 11 = nor\n  input  [31:0] alu_a,\n  input  [31:0] alu_b,\n  output [31:0] result\n);\n\n  assign result\n    = ( logical_fn == 2'b00 ) ?  ( alu_a & alu_b ) :\n      ( logical_fn == 2'b01 ) ?  ( alu_a | alu_b ) :\n      ( logical_fn == 2'b10 ) ?  ( alu_a ^ alu_b ) :\n      ( logical_fn == 2'b11 ) ? ~( alu_a | alu_b ) :\n                                 ( 32'bx );\n\nendmodule\n\n//------------------------------------------------------------------------\n// muldiv unit\n//------------------------------------------------------------------------\n\nmodule riscv_CoreDpathAluMulDiv\n(\n  input      [ 2:0] muldiv_fn, // 00 = mul, 01 = div, 10 = divu, 11 = rem, 100 = remu\n  input      [31:0] alu_a,     // A operand\n  input      [31:0] alu_b,     // B operand\n  output     [31:0] result     // result\n);\n\n  wire              negative   = ( alu_a[31] ^ alu_b[31] );\n\n  wire       [31:0] alu_a_u    = ( alu_a[31] == 1'b1 ) ? ( ~alu_a + 1 )\n                               :                         alu_a;\n  wire       [31:0] alu_b_u    = ( alu_b[31] == 1'b1 ) ? ( ~alu_b + 1 )\n                               :                         alu_b;\n\n  wire       [31:0] product    = alu_a * alu_b;\n  wire       [31:0] quotientu  = alu_a / alu_b;\n  wire       [31:0] remainderu = alu_a % alu_b;\n\n  wire       [31:0] quotient_raw   = alu_a_u / alu_b_u;\n  wire       [31:0] remainder_raw  = alu_a_u % alu_b_u;\n\n  wire       [31:0] quotient       = negative  ? ( ~quotient_raw + 1 )\n                                   :             quotient_raw;\n\n  // Remainder is same sign as dividend\n  wire       [31:0] remainder      = alu_a[31] ? ( ~remainder_raw + 1 )\n                                   :             remainder_raw;\n\n  assign result = ( muldiv_fn == 3'd0 ) ? product\n                : ( muldiv_fn == 3'd1 ) ? quotient\n                : ( muldiv_fn == 3'd2 ) ? quotientu\n                : ( muldiv_fn == 3'd3 ) ? remainder\n                : ( muldiv_fn == 3'd4 ) ? remainderu\n                :                         32'bx;\n\nendmodule\n\n//-------------------------------------------------------------------------\n// Main alu\n//-------------------------------------------------------------------------\n\nmodule riscv_CoreDpathAlu\n(\n  input  [31:0] in0,\n  input  [31:0] in1,\n  input  [ 3:0] fn,\n  output [31:0] out\n);\n\n  // -- Decoder ----------------------------------------------------------\n\n  reg [1:0] out_mux_sel;\n  reg [1:0] fn_addsub;\n  reg [1:0] fn_shifter;\n  reg [1:0] fn_logical;\n  reg [2:0] fn_muldiv;\n\n  reg [10:0] cs;\n\n  always @(*)\n  begin\n\n    cs = 11'bx;\n    case ( fn )\n      4'd0  : cs = { 2'd0, 2'b00, 2'bxx, 2'bxx, 3'bxx  }; // ADD\n      4'd1  : cs = { 2'd0, 2'b01, 2'bxx, 2'bxx, 3'bxx  }; // SUB\n      4'd2  : cs = { 2'd1, 2'bxx, 2'b00, 2'bxx, 3'bxx  }; // SLL\n      4'd3  : cs = { 2'd2, 2'bxx, 2'bxx, 2'b01, 3'bxx  }; // OR\n      4'd4  : cs = { 2'd0, 2'b10, 2'bxx, 2'bxx, 3'bxx  }; // SLT\n      4'd5  : cs = { 2'd0, 2'b11, 2'bxx, 2'bxx, 3'bxx  }; // SLTU\n      4'd6  : cs = { 2'd2, 2'bxx, 2'bxx, 2'b00, 3'bxx  }; // AND\n      4'd7  : cs = { 2'd2, 2'bxx, 2'bxx, 2'b10, 3'bxx  }; // XOR\n      4'd8  : cs = { 2'd2, 2'bxx, 2'bxx, 2'b11, 3'bxx  }; // NOR\n      4'd9  : cs = { 2'd1, 2'bxx, 2'b01, 2'bxx, 3'bxx  }; // SRL\n      4'd10 : cs = { 2'd1, 2'bxx, 2'b11, 2'bxx, 3'bxx  }; // SRA\n      4'd11 : cs = { 2'd3, 2'bxx, 2'bxx, 2'bxx, 3'b000 }; // MUL\n      4'd12 : cs = { 2'd3, 2'bxx, 2'bxx, 2'bxx, 3'b001 }; // DIV\n      4'd13 : cs = { 2'd3, 2'bxx, 2'bxx, 2'bxx, 3'b010 }; // DIVU\n      4'd14 : cs = { 2'd3, 2'bxx, 2'bxx, 2'bxx, 3'b011 }; // REM\n      4'd15 : cs = { 2'd3, 2'bxx, 2'bxx, 2'bxx, 3'b100 }; // REMU\n    endcase\n\n    { out_mux_sel, fn_addsub, fn_shifter, fn_logical, fn_muldiv } = cs;\n\n  end\n\n  // -- Functional units -------------------------------------------------\n\n  wire [31:0] addsub_out;\n\n  riscv_CoreDpathAluAddSub addsub\n  (\n    .addsub_fn  (fn_addsub),\n    .alu_a      (in0),\n    .alu_b      (in1),\n    .result     (addsub_out)\n  );\n\n  wire [31:0] shifter_out;\n\n  riscv_CoreDpathAluShifter shifter\n  (\n    .shift_fn   (fn_shifter),\n    .alu_a      (in1),\n    .alu_b      (in0),\n    .result     (shifter_out)\n  );\n\n  wire [31:0] logical_out;\n\n  riscv_CoreDpathAluLogical logical\n  (\n    .logical_fn (fn_logical),\n    .alu_a      (in0),\n    .alu_b      (in1),\n    .result     (logical_out)\n  );\n\n  wire [31:0] muldiv_out;\n\n  riscv_CoreDpathAluMulDiv muldiv\n  (\n    .muldiv_fn  (fn_muldiv),\n    .alu_a      (in0),\n    .alu_b      (in1),\n    .result     (muldiv_out)\n  );\n\n  // -- Final output mux -------------------------------------------------\n\n  assign out = ( out_mux_sel == 2'd0 ) ? addsub_out\n             : ( out_mux_sel == 2'd1 ) ? shifter_out\n             : ( out_mux_sel == 2'd2 ) ? logical_out\n             : ( out_mux_sel == 2'd3 ) ? muldiv_out\n             :                           32'bx;\n\nendmodule\n\n`endif"}, "M": {"name": "imuldiv-IntMulDivIterative.v", "path": "lab1/imuldiv/imuldiv-IntMulDivIterative.v", "text": "//========================================================================\n// Lab 1 - Iterative Mul/Div Unit\n//========================================================================\n\n`ifndef RISCV_INT_MULDIV_ITERATIVE_V\n`define RISCV_INT_MULDIV_ITERATIVE_V\n\n`include \"imuldiv-MulDivReqMsg.v\"\n`include \"imuldiv-IntMulIterative.v\"\n`include \"imuldiv-IntDivIterative.v\"\n\nmodule imuldiv_IntMulDivIterative\n(\n  input         clk,\n  input         reset,\n\n  input   [2:0] muldivreq_msg_fn,\n  input  [31:0] muldivreq_msg_a,\n  input  [31:0] muldivreq_msg_b,\n  input         muldivreq_val,\n  output        muldivreq_rdy,\n\n  output [63:0] muldivresp_msg_result,\n  output        muldivresp_val,\n  input         muldivresp_rdy\n);\n\n  //----------------------------------------------------------------------\n  // Input Select\n  //----------------------------------------------------------------------\n\n  wire mulreq_val    = ( muldivreq_msg_fn == `IMULDIV_MULDIVREQ_MSG_FUNC_MUL )\n                     &&  muldivreq_val && divreq_rdy;\n\n  wire divreq_val    = ( muldivreq_msg_fn != `IMULDIV_MULDIVREQ_MSG_FUNC_MUL )\n                     &&  muldivreq_val && mulreq_rdy;\n\n  wire divreq_msg_fn = ( muldivreq_msg_fn == `IMULDIV_MULDIVREQ_MSG_FUNC_DIV\n                     ||  muldivreq_msg_fn == `IMULDIV_MULDIVREQ_MSG_FUNC_REM );\n\n  //----------------------------------------------------------------------\n  // Output Select\n  //----------------------------------------------------------------------\n\n  wire        mulreq_rdy;\n  wire        divreq_rdy;\n  wire        mulresp_val;\n  wire        divresp_val;\n  wire [63:0] mulresp_msg_result;\n  wire [63:0] divresp_msg_result;\n\n  assign muldivreq_rdy          = mulreq_rdy && divreq_rdy;\n\n  assign muldivresp_val         = mulresp_val || divresp_val;\n\n  assign muldivresp_msg_result = ( mulresp_val ) ? mulresp_msg_result\n                               : ( divresp_val ) ? divresp_msg_result\n                               :                   64'bx;\n\n  //----------------------------------------------------------------------\n  // Mul/Div Modules\n  //----------------------------------------------------------------------\n\n  imuldiv_IntMulIterative imul\n  (\n    .clk                (clk),\n    .reset              (reset),\n    .mulreq_msg_a       (muldivreq_msg_a),\n    .mulreq_msg_b       (muldivreq_msg_b),\n    .mulreq_val         (mulreq_val),\n    .mulreq_rdy         (mulreq_rdy),\n    .mulresp_msg_result (mulresp_msg_result),\n    .mulresp_val        (mulresp_val),\n    .mulresp_rdy        (muldivresp_rdy)\n  );\n\n  imuldiv_IntDivIterative idiv\n  (\n    .clk                (clk),\n    .reset              (reset),\n    .divreq_msg_fn      (divreq_msg_fn),\n    .divreq_msg_a       (muldivreq_msg_a),\n    .divreq_msg_b       (muldivreq_msg_b),\n    .divreq_val         (divreq_val),\n    .divreq_rdy         (divreq_rdy),\n    .divresp_msg_result (divresp_msg_result),\n    .divresp_val        (divresp_val),\n    .divresp_rdy        (muldivresp_rdy)\n  );\n\nendmodule\n\n`endif"}, "I": {"name": "riscvstall-InstMsg.v", "path": "lab1/riscvstall/riscvstall-InstMsg.v", "text": "//========================================================================\n// RISCV Instruction Type\n//========================================================================\n// Instruction types are similar to message types but are strictly used\n// for communication between the control and datapath of a RISCV-based\n// processor. Instruction \"messages\" can be unpacked into the various\n// fields as defined by the RISCV ISA, as well as be constructed from\n// specifying each field explicitly. The 32-bit instruction has different\n// fields depending on the format of the instruction used. The following\n// are the various instruction encoding formats used in the RISCV ISA.\n//\n// R-type:\n//\n//   31                 25 24             20 19     15 14    12 11                 7 6      0\n//  +---------------------+-----------------+---------+--------+--------------------+--------+\n//  |       funct7        |       rs2       |   rs1   | funct3 |         rd         | opcode |\n//  +---------------------+-----------------+---------+--------+--------------------+--------+\n//\n// I-type:\n//\n//   31                                   20 19     15 1
