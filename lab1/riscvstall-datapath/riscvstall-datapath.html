4    12 11                 7 6      0\n//  +---------------------+-----------------+---------+--------+--------------------+--------+\n//  |               imm[11:0]               |   rs1   | funct3 |         rd         | opcode |\n//  +---------------------+-----------------+---------+--------+--------------------+--------+\n//\n// S-type:\n//\n//   31                 25 24             20 19     15 14    12 11                 7 6      0\n//  +---------------------+-----------------+---------+--------+--------------------+--------+\n//  |      imm[11:5]      |       rs2       |   rs1   | funct3 |      imm[4:0]      | opcode |\n//  +---------------------+-----------------+---------+--------+--------------------+--------+\n//\n// SB-type:\n//\n//   31        30       25 24             20 19     15 14    12 11       8         7 6      0\n//  +---------+-----------+-----------------+---------+--------+----------+---------+--------+\n//  | imm[12] | imm[10:5] |       rs2       |   rs1   | funct3 | imm[4:1] | imm[11] | opcode |\n//  +---------+-----------+-----------------+---------+--------+----------+---------+--------+\n//\n// U-type:\n//\n//   31                                                      12 11                 7 6      0\n//  +----------------------------------------------------------+--------------------+--------+\n//  |                        imm[31:12]                        |         rd         | opcode |\n//  +----------------------------------------------------------+--------------------+--------+\n//\n// UJ-type:\n//\n//   31        30               21        20 19              12 11                 7 6      0\n//  +---------+-------------------+---------+------------------+--------------------+--------+\n//  | imm[20] |     imm[10:1]     | imm[11] |    imm[19:12]    |          rd        | opcode |\n//  +---------+-------------------+---------+------------------+--------------------+--------+\n//\n// The instruction type also defines a list of instruct ( minidasm, \"lb    \");\n        `RISCV_INST_MSG_LH      : $sformat( minidasm, \"lh    \");\n        `RISCV_INST_MSG_LW      : $sformat( minidasm, \"lw    \");\n        `RISCV_INST_MSG_LBU     : $sformat( minidasm, \"lbu   \");\n        `RISCV_INST_MSG_LHU     : $sformat( minidasm, \"lhu   \");\n        `RISCV_INST_MSG_SB      : $sformat( minidasm, \"sb    \");\n        `RISCV_INST_MSG_SH      : $sformat( minidasm, \"sh    \");\n        `RISCV_INST_MSG_SW      : $sformat( minidasm, \"sw    \");\n        `RISCV_INST_MSG_ADDI    : $sformat( minidasm, \"addi  \");\n        `RISCV_INST_MSG_SLTI    : $sformat( minidasm, \"slti  \");\n        `RISCV_INST_MSG_SLTIU   : $sformat( minidasm, \"sltiu \");\n        `RISCV_INST_MSG_ANDI    : $sformat( minidasm, \"andi  \");\n        `RISCV_INST_MSG_ORI     : $sformat( minidasm, \"ori   \");\n        `RISCV_INST_MSG_XORI    : $sformat( minidasm, \"xori  \");\n        `RISCV_INST_MSG_SLLI    : $sformat( minidasm, \"slli  \");\n        `RISCV_INST_MSG_SRLI    : $sformat( minidasm, \"srli  \");\n        `RISCV_INST_MSG_SRAI    : $sformat( minidasm, \"srai  \");\n        `RISCV_INST_MSG_ADD     : $sformat( minidasm, \"add   \");\n        `RISCV_INST_MSG_SUB     : $sformat( minidasm, \"sub   \");\n        `RISCV_INST_MSG_SLL     : $sformat( minidasm, \"sll   \");\n        `RISCV_INST_MSG_SLT     : $sformat( minidasm, \"slt   \");\n        `RISCV_INST_MSG_SLTU    : $sformat( minidasm, \"sltu  \");\n        `RISCV_INST_MSG_XOR     : $sformat( minidasm, \"xor   \");\n        `RISCV_INST_MSG_SRL     : $sformat( minidasm, \"srl   \");\n        `RISCV_INST_MSG_SRA     : $sformat( minidasm, \"sra   \");\n        `RISCV_INST_MSG_OR      : $sformat( minidasm, \"or    \");\n        `RISCV_INST_MSG_AND     : $sformat( minidasm, \"and   \");\n        `RISCV_INST_MSG_CSRW    : $sformat( minidasm, \"csrw  \");\n        // RISCV32M\n        `RISCV_INST_MSG_MUL     : $sformat( minidasm, \"mul   \");\n        // `RISCV_INST_MSG_MULH    : $sformat( minidasm, \"mulh  \");\n        // `RISCV_INST_MSG_MULHSU  : $sformat( minidasm, \"mulhsu\");\n        // `RISCV_INST_MSG_MULHU   : $sformat( minidasm, \"mulhu \");\n        `RISCV_INST_MSG_DIV     : $sformat( minidasm, \"div   \");\n        `RISCV_INST_MSG_DIVU    : $sformat( minidasm, \"divu  \");\n        `RISCV_INST_MSG_REM     : $sformat( minidasm, \"rem   \");\n        `RISCV_INST_MSG_REMU    : $sformat( minidasm, \"remu  \");\n        default                : $sformat( minidasm,  \"undef \");\n      endcase\n\n    end\n\n  end\n\nendmodule\n`endif\n\n`endif\n\n// vim: set textwidth=0 tabstop=2 shiftwidth=2 softtabstop=2 expandtab :"}, "S": {"name": "riscvstall-randdelay-sim.v", "path": "lab1/riscvstall/riscvstall-randdelay-sim.v", "text": "//=========================================================================\n// 5-Stage RISCV Processor Simulator\n//=========================================================================\n\n`include \"riscvstall-Core.v\"\n`include \"vc-TestDualPortRandDelayMem.v\"\n\nmodule riscv_sim;\n\n  //----------------------------------------------------------------------\n  // Setup\n  //----------------------------------------------------------------------\n\n  reg clk   = 1'b0;\n  reg reset = 1'b1;\n\n  always #5 clk = ~clk;\n\n  wire [31:0] status;\n\n  //----------------------------------------------------------------------\n  // Wires for connecting processor and memory\n  //----------------------------------------------------------------------\n\n  wire [`VC_MEM_REQ_MSG_SZ(32,32)-1:0] imemreq_msg;\n  wire                                 imemreq_val;\n  wire                                 imemreq_rdy;\n  wire   [`VC_MEM_RESP_MSG_SZ(32)-1:0] imemresp_msg;\n  wire                                 imemresp_val;\n\n  wire [`VC_MEM_REQ_MSG_SZ(32,32)-1:0] dmemreq_msg;\n  wire                                 dmemreq_val;\n  wire                                 dmemreq_rdy;\n  wire   [`VC_MEM_RESP_MSG_SZ(32)-1:0] dmemresp_msg;\n  wire                                 dmemresp_val;\n\n  //----------------------------------------------------------------------\n  // Reset signals for processor and memory\n  //----------------------------------------------------------------------\n\n  reg reset_mem;\n  reg reset_proc;\n\n  always @ ( posedge clk ) begin\n    reset_mem  \u003c= reset;\n    reset_proc \u003c= reset_mem;\n  end\n\n  //----------------------------------------------------------------------\n  // Processor\n  //----------------------------------------------------------------------\n\n  riscv_Core proc\n  (\n    .clk               (clk),\n    .reset             (reset_proc),\n\n    // Instruction request interface\n\n    .imemreq_msg       (imemreq_msg),\n    .imemreq_val       (imemreq_val),\n    .imemreq_rdy       (imemreq_rdy),\n\n    // Instruction response interface\n\n    .imemresp_msg      (imemresp_msg),\n    .imemresp_val      (imemresp_val),\n\n    // Data request interface\n\n    .dmemreq_msg       (dmemreq_msg),\n    .dmemreq_val       (dmemreq_val),\n    .dmemreq_rdy       (dmemreq_rdy),\n\n    // Data response interface\n\n    .dmemresp_msg      (dmemresp_msg),\n    .dmemresp_val      (dmemresp_val),\n\n    // CSR status register output to host\n\n    .csr_status        (status)\n  );\n\n  //----------------------------------------------------------------------\n  // Test Memory\n  //----------------------------------------------------------------------\n\n  vc_TestDualPortRandDelayMem\n  #(\n    .p_mem_sz    (1\u003c\u003c20), // max 20-bit address to index into memory\n    .p_addr_sz   (32),    // high order bits will get truncated in memory\n    .p_data_sz   (32),\n    .p_max_delay (4)\n  )\n  mem\n  (\n    .clk                (clk),\n    .reset              (reset_mem),\n\n    // Instruction request interface\n\n    .memreq0_val        (imemreq_val),\n    .memreq0_rdy        (imemreq_rdy),\n    .memreq0_msg        (imemreq_msg),\n\n    // Instruction response interface\n\n    .memresp0_val       (imemresp_val),\n    .memresp0_rdy       (1'b1),\n    .memresp0_msg       (imemresp_msg),\n\n    // Data request interface\n\n    .memreq1_val        (dmemreq_val),\n    .memreq1_rdy        (dmemreq_rdy),\n    .memreq1_msg        (dmemreq_msg),\n\n    // Data response interface\n\n    .memresp1_val       (dmemresp_val),\n    .memresp1_rdy       (1'b1),\n    .memresp1_msg       (dmemresp_msg)\n   );\n\n  //----------------------------------------------------------------------\n  // Start the simulation\n  //----------------------------------------------------------------------\n\n  integer fh;\n  reg [1023:0] exe_filename;\n  reg [1023:0] vcd_filename;\n  reg   [31:0] max_cycles;\n  reg          verbose;\n  reg          stats;\n  reg          vcd;\n  reg    [1:0] disasm;\n\n  integer i;\n\n  initial begin\n\n    // Load program into memory from the command line\n    if ( $value$plusargs( \"exe=%s\", exe_filename ) ) begin\n\n      // Check that file exists\n      fh = $fopen( exe_filename, \"r\" );\n      if ( !fh ) begin\n        $display( \"\\n ERROR: Could not open vmh file (%s)! \\n\", exe_filename );\n        $finish;\n      end\n      $fclose(fh);\n\n      $readmemh( exe_filename, mem.mem.m );\n\n    end\n    else begin\n      $display( \"\\n ERROR: No executable specified! (use +exe=\u003cfilename>) \\n\" );\n      $finish;\n    end\n\n    // Get max number of cycles to run simulation for from command line\n    if ( !$value$plusargs( \"max-cycles=%d\", max_cycles ) ) begin\n      max_cycles = 100000;\n    end\n\n    // Get stats flag\n    if ( !$value$plusargs( \"stats=%d\", stats ) ) begin\n\n      // Get verbose flag\n      if ( !$value$plusargs( \"verbose=%d\", verbose ) ) begin\n        verbose = 1'b0;\n      end\n\n      proc.ctrl.stats_en = 1'b0;\n    end\n    else begin\n      verbose = 1'b1;\n      proc.ctrl.stats_en = 1'b1;\n    end\n\n    // vcd dump\n    if ( $value$plusargs( \"vcd=%d\", vcd ) ) begin\n      vcd_filename = { exe_filename[983:32], \"-rand.vcd\" }; // Super hack, remove last 3 chars,\n                                                            // replace with .vcd extension\n      $dumpfile( vcd_filename );\n      $dumpvars;\n    end\n\n    // Disassemble instructions\n    if ( !$value$plusargs( \"disasm=%d\", disasm ) ) begin\n      disasm = 2'b0;\n    end\n\n    // Stobe reset\n    #5  reset = 1'b1;\n    #60 reset = 1'b0;\n\n  end\n\n  //----------------------------------------------------------------------\n  // Disassemble instructions\n  //----------------------------------------------------------------------\n\n  always @ ( posedge clk ) begin\n    if ( disasm == 3 ) begin\n\n      // Fetch Stage\n\n      if ( proc.ctrl.bubble_Fhl )\n        $write( \"{  (-_-)   |\" );\n      else if ( proc.ctrl.squash_Fhl )\n        $write( \"{-%h-|\", proc.dpath.pc_Fhl );\n      else if ( proc.ctrl.stall_Fhl )\n        $write( \"{#%h |\", proc.dpath.pc_Fhl );\n      else\n        $write( \"{ %h |\", proc.dpath.pc_Fhl );\n\n      // Decode Stage\n\n      if ( proc.ctrl.bubble_Dhl )\n        $write( \"  (-_-) \" );\n      else if ( proc.ctrl.squash_Dhl )\n        $write( \"-%s-\", proc.ctrl.inst_msg_disasm_D.minidasm );\n      else if ( proc.ctrl.stall_Dhl )\n        $write( \"#%s \", proc.ctrl.inst_msg_disasm_D.minidasm );\n      else\n        $write( \" %s \", proc.ctrl.inst_msg_disasm_D.minidasm );\n\n      $write( \"|\" );\n\n      // Execute Stage\n\n      if ( proc.ctrl.bubble_Xhl )\n        $write( \"  (-_-) \" );\n      else if ( proc.ctrl.squash_Xhl )\n        $write( \"-%s-\", proc.ctrl.inst_msg_disasm_X.minidasm );\n      else if ( proc.ctrl.stall_Xhl )\n        $write( \"#%s \", proc.ctrl.inst_msg_disasm_X.minidasm );\n      else\n        $write( \" %s \", proc.ctrl.inst_msg_disasm_X.minidasm );\n\n      $write( \"|\" );\n\n      // Memory Stage\n\n      if ( proc.ctrl.bubble_Mhl )\n        $write( \"  (-_-) \" );\n      else if ( proc.ctrl.squash_Mhl )\n        $write( \"-%s-\", proc.ctrl.inst_msg_disasm_M.minidasm );\n      else if ( proc.ctrl.stall_Mhl )\n        $write( \"#%s \", proc.ctrl.inst_msg_disasm_M.minidasm );\n      else\n        $write( \" %s \", proc.ctrl.inst_msg_disasm_M.minidasm );\n\n      $write( \"|\" );\n\n      // Writeback Stage\n\n      if ( proc.ctrl.bubble_Whl )\n        $write( \"  (-_-) \" );\n      else if ( proc.ctrl.squash_Whl )\n        $write( \"-%s-\", proc.ctrl.inst_msg_disasm_W.minidasm );\n      else if ( proc.ctrl.stall_Whl )\n        $write( \"#%s \", proc.ctrl.inst_msg_disasm_W.minidasm );\n      else\n        $write( \" %s \", proc.ctrl.inst_msg_disasm_W.minidasm );\n\n      $display( \"}\" );\n\n    end\n    else if ( disasm > 0 ) begin\n      if ( proc.ctrl.inst_val_debug ) begin\n        $display( \"%h: %h: %s\",\n                   proc.dpath.pc_debug, proc.ctrl.ir_debug, proc.ctrl.inst_msg_disasm_debug.dasm );\n\n        if ( disasm > 1 ) begin\n          $display( \"r00=%h r01=%h r02=%h r03=%h r04=%h r05=%h\",\n                     proc.dpath.rfile.registers[ 0], proc.dpath.rfile.registers[ 1],\n                     proc.dpath.rfile.registers[ 2], proc.dpath.rfile.registers[ 3],\n                     proc.dpath.rfile.registers[ 4], proc.dpath.rfile.registers[ 5] );\n          $display( \"r06=%h r07=%h r08=%h r09=%h r10=%h r11=%h\",\n                     proc.dpath.rfile.registers[ 6], proc.dpath.rfile.registers[ 7],\n                     proc.dpath.rfile.registers[ 8], proc.dpath.rfile.registers[ 9],\n                     proc.dpath.rfile.registers[10], proc.dpath.rfile.registers[11] );\n          $display( \"r12=%h r13=%h r14=%h r15=%h r16=%h r17=%h\",\n                     proc.dpath.rfile.registers[12], proc.dpath.rfile.registers[13],\n                     proc.dpath.rfile.registers[14], proc.dpath.rfile.registers[15],\n                     proc.dpath.rfile.registers[16], proc.dpath.rfile.registers[17] );\n          $display( \"r18=%h r19=%h r20=%h r21=%h r22=%h r23=%h\",\n                     proc.dpath.rfile.registers[18], proc.dpath.rfile.registers[19],\n                     proc.dpath.rfile.registers[20], proc.dpath.rfile.registers[21],\n                     proc.dpath.rfile.registers[22], proc.dpath.rfile.registers[23] );\n          $display( \"r24=%h r25=%h r26=%h r27=%h r28=%h r29=%h\",\n                     proc.dpath.rfile.registers[24], proc.dpath.rfile.registers[25],\n                     proc.dpath.rfile.registers[26], proc.dpath.rfile.registers[27],\n                     proc.dpath.rfile.registers[28], proc.dpath.rfile.registers[29] );\n          $display( \"r30=%h r31=%h\",\n                     proc.dpath.rfile.registers[30], proc.dpath.rfile.registers[31] );\n        end\n\n        $display( \"-----\" );\n      end\n    end\n  end\n\n  //----------------------------------------------------------------------\n  // Stop running when status changes\n  //----------------------------------------------------------------------\n\n  real ipc;\n\n  always @ ( * ) begin\n    if ( !reset && ( status != 0 ) ) begin\n\n      if ( status == 1'b1 )\n        $display( \"*** PASSED ***\" );\n\n      if ( status > 1'b1 )\n        $display( \"*** FAILED *** (status = %d)\", status );\n\n      if ( verbose == 1'b1 ) begin\n        ipc = proc.ctrl.num_inst/$itor(proc.ctrl.num_cycles);\n\n        $display( \"--------------------------------------------\" );\n        $display( \" STATS                                      \" );\n        $display( \"--------------------------------------------\" );\n\n        $display( \" status     = %d\", status                     );\n        $display( \" num_cycles = %d\", proc.ctrl.num_cycles       );\n        $display( \" num_inst   = %d\", proc.ctrl.num_inst         );\n        $display( \" ipc        = %f\", ipc                        );\n      end\n\n      #20 $finish;\n\n    end\n  end\n\n  //----------------------------------------------------------------------\n  // Safety net to catch infinite loops\n  //----------------------------------------------------------------------\n\n  reg [31:0] cycle_count = 32'b0;\n\n  always @ ( posedge clk ) begin\n    cycle_count = cycle_count + 1'b1;\n  end\n\n  always @ ( * ) begin\n    if ( cycle_count > max_cycles ) begin\n      #20;\n      $display(\"*** FAILED *** (timeout)\");\n      $finish;\n   end\n  end\n\nendmodule"}}</script>

  add('X','ALU 做 '+I.alu+'。'+(I.pc==='b'?'Branch Cond 由結果判斷 '+I.br+'；成立就 brj_taken_Xhl = 1，squash F 與 D。':'')+(I.mem==='ld'?'結果當位址，送出 dmem 讀取 request。':'')+(I.mem==='st'?'結果當位址、wdata_Xhl 當資料，送出 dmem 寫入 request。':'')+(I.ex?'execute mux 選 0 (ALU)。':''));
  add('M',I.mem==='ld'?'等 dmemresp_val；回應經 dmemresp mux (0 = word)，wb mux 選 1 (記憶體)。':I.mem==='st'?'等寫入的 response 回來，沒有東西要寫回。':I.wb?'wb mux 選 0 (X 級結果)。':'沒有東西要寫回，只是路過。');
  add('W',I.wen?'rf_wen_out_Whl = 1，wb_mux_out_Whl 寫進 Regfile[rd]。':I.csr?'csr_wen_Whl = 1，資料經 proc2csr_data_Whl 寫進 csr_status。':'不寫 Regfile (rf_wen = 0)，指令 retire。');
  panel.appendChild(st);
  panel.appendChild(h('h3','','解碼表這一列 (cs)'));
  const tb=h('table','cs');const row=(k,v)=>{const tr=h('tr');tr.appendChild(h('td','',k));tr.appendChild(h('td','',v));tb.appendChild(tr);};
  row('j_en / br_sel',(I.pc==='j'?'y':'n')+' / br_'+(I.br||'none'));
  row('pc_mux_sel',{p:'pm_p (0)',j:'pm_j (2)',b:'pm_b (1)'}[I.pc]);
  row('op0_mux_sel',['am_rdat','am_pc','am_pc4','am_0'][I.op0]+' ('+I.op0+')');
  row('op1_mux_sel',['bm_rdat','bm_shamt','bm_imm_u','bm_imm_sb','bm_imm_i','bm_imm_s','bm_0'][I.op1]+' ('+I.op1+')');
  row('rs1_en / rs2_en',(I.rs1?'y':'n')+' / '+(I.rs2?'y':'n'));
  row('alu_fn','alu_'+I.alu);row('execute_mux_sel',I.ex?'em_alu (0)':'em_x (don\'t care)');
  row('mem req',{nr:'nr (無)',ld:'ld · ml_w · dmm_w',st:'st · ml_w'}[I.mem]);
  row('wb_mux_sel',I.wb==='mem'?'wm_mem (1)':I.wb==='alu'?'wm_alu (0)':I.mem==='st'?'wm_mem (無作用)':'wm_x');
  row('rf_wen / csr_wen',(I.wen?'y':'n')+' / '+(I.csr?'y':'n'));
  panel.appendChild(tb);
  if(I.pc==='b')panel.appendChild(h('p','src','圖上畫的是 branch 成立 (taken) 的情況。不成立時 PC mux 維持選 0，回授線不作用。'));
  const mk=['RISCV_INST_MSG_'+curIns];renderSource(panel,grepRefs(mk).filter(r=>r.f==='C'||r.f==='I').map(r=>Object.assign(r,{note:r.f==='C'?'解碼表這一列':'指令編碼',kind:r.f==='C'?'k-drive':''})),mk);
}
function setIns(name){
  curIns=name;clearMarks('on');svg.querySelectorAll('.insel').forEach(e=>e.classList.remove('insel'));
  document.querySelectorAll('#insbar button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ins===(name||''))));
  if(name){const {A,M}=activeFor(INS[name]);
    NETS.forEach(N=>{const u=A[N.id];if(!u)return;let any=false;
      N.s.forEach((s,i)=>{const ok=u.has('*')||s[0]==='*'||s[0].split(' ').some(x=>u.has(x));if(ok){N.segEls[i].classList.add('on');any=true;if(s.a)nodeEls[s.a].classList.add('on');if(s.b)nodeEls[s.b].classList.add('on');}});
      if(any){netEls[N.id].classList.add('on');if(N.labEl)N.labEl.classList.add('on');}});
    Object.keys(M).forEach(m=>{const e=NODE[m].inEls[M[m]];if(e)e.classList.add('insel');});
  }
  select(null);
}
// toolbar
const insbar=document.getElementById('insbar');
[['','無'],...Object.keys(INS).map(k=>[k,k])].forEach(([k,t])=>{const b=h('button','chip',t);b.type='button';b.id='ins-'+(k||'none');b.dataset.ins=k;b.setAttribute('aria-pressed',String(!k));b.addEventListener('click',()=>setIns(k||null));insbar.appendChild(b);});
const viewbar=document.getElementById('viewbar');
Object.keys(VIEWS).forEach((k,i)=>{const b=h('button','chip view',k);b.type='button';b.id='view-'+i;b.addEventListener('click',()=>zoomTo(VIEWS[k]));viewbar.appendChild(b);});
document.getElementById('lyCtrl').addEventListener('change',e=>svg.classList.toggle('hide-ctrl',!e.target.checked));
document.getElementById('lyStall').addEventListener('change',e=>svg.classList.toggle('hide-stall',!e.target.checked));

// hover + click
function targetOf(e){const t=e.target.closest&&e.target.closest('[data-net],[data-node]');if(!t)return null;return t.dataset.net?['net',t.dataset.net]:['node',t.dataset.node];}
svg.addEventListener('pointerover',e=>{const t=targetOf(e);clearMarks('hl');if(!t||drag.active){tip.hidden=true;return;}
  mark(t[0],t[1],'hl');tip.textContent='';
  if(t[0]==='net'){const N=NET[t[1]];tip.appendChild(document.createTextNode(N.n));tip.appendChild(h('small','',typeof N.w==='number'?'['+N.w+']':N.w));}
  else tip.appendChild(document.createTextNode(NODE[t[1]].title));
  tip.hidden=false;});
svg.addEventListener('pointerleave',()=>{clearMarks('hl');tip.hidden=true;});
svg.addEventListener('pointermove',e=>{if(tip.hidden)return;const r=wrap.getBoundingClientRect();let x=e.clientX-r.left+14,y=e.clientY-r.top+16;
  if(x+tip.offsetWidth>r.width-6)x=r.width-tip.offsetWidth-6;if(y+tip.offsetHeight>r.height-6)y=e.clientY-r.top-tip.offsetHeight-10;tip.style.left=Math.max(4,x)+'px';tip.style.top=y+'px';});
svg.addEventListener('click',e=>{if(drag.moved){drag.moved=false;return;}const t=targetOf(e);if(t)select(t[0],t[1]);else if(sel)select(null);});
svg.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const t=targetOf(e);if(t){e.preventDefault();select(t[0],t[1]);}});

/* -------------------------------------------------------------- pan / zoom */
let view=[0,0,W,H],anim=null;
const apply=()=>svg.setAttribute('viewBox',view.join(' '));
const scale=()=>{const r=svg.getBoundingClientRect();return Math.max(view[2]/r.width,view[3]/r.height);};
function clampView(v){const w=Math.min(Math.max(v[2],160),W*1.6),k=w/v[2];const hh=v[3]*k;let x=v[0]+(v[2]-w)/2,y=v[1]+(v[3]-hh)/2;
  x=Math.min(Math.max(x,-w*0.6),W-w*0.4);y=Math.min(Math.max(y,-hh*0.6),H-hh*0.4);return [x,y,w,hh];}
function zoomTo(t){cancelAnimationFrame(anim);const from=view.slice(),to=t.slice();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){view=to;apply();return;}
  const t0=performance.now();const step=now=>{let k=Math.min(1,(now-t0)/280);k=1-Math.pow(1-k,3);view=from.map((v,i)=>v+(to[i]-v)*k);apply();if(k<1)anim=requestAnimationFrame(step);};anim=requestAnimationFrame(step);}
function zoomAt(cx,cy,f){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const nv=clampView([p.x-(p.x-view[0])*f,p.y-(p.y-view[1])*f,view[2]*f,view[3]*f]);view=nv;apply();}
svg.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*(e.ctrlKey?0.01:0.0016)));},{passive:false});
const drag={active:false,moved:false,ptrs:new Map(),d0:0};
svg.addEventListener('pointerdown',e=>{drag.ptrs.set(e.pointerId,[e.clientX,e.clientY]);drag.moved=false;drag.dist=0;cancelAnimationFrame(anim);
  if(drag.ptrs.size===2){const p=[...drag.ptrs.values()];drag.d0=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);}});
svg.addEventListener('pointermove',e=>{const prev=drag.ptrs.get(e.pointerId);if(!prev)return;const cur=[e.clientX,e.clientY];
  if(drag.ptrs.size===1){const dx=cur[0]-prev[0],dy=cur[1]-prev[1];drag.dist+=Math.abs(dx)+Math.abs(dy);
    if(drag.dist>5){if(!drag.active){drag.active=true;drag.moved=true;svg.classList.add('grabbing');tip.hidden=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}}
      const s=scale();view=clampView([view[0]-dx*s,view[1]-dy*s,view[2],view[3]]);apply();}
    drag.ptrs.set(e.pointerId,cur);
  }else if(drag.ptrs.size===2){drag.ptrs.set(e.pointerId,cur);const p=[...drag.ptrs.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    if(drag.d0>0){zoomAt((p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2,drag.d0/d);drag.moved=true;}drag.d0=d;}});
const endPtr=e=>{drag.ptrs.delete(e.pointerId);if(!drag.ptrs.size){drag.active=false;svg.classList.remove('grabbing');}};
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
const center=f=>{const r=svg.getBoundingClientRect();cancelAnimationFrame(anim);zoomAt(r.left+r.width/2,r.top+r.height/2,f);};
document.getElementById('zi').addEventListener('click',()=>center(1/1.35));
document.getElementById('zo').addEventListener('click',()=>center(1.35));
document.getElementById('zf').addEventListener('click',()=>zoomTo(VIEWS['全圖']));

apply();setIns(null);
// deep link: #node=pcmux or #net=alu_out
try{const m=location.hash.match(/^#(node|net)=(\w+)$/);if(m&&(m[1]==='node'?NODE:NET)[m[2]])select(m[1],m[2]);}catch(_){}
})();
</script>
